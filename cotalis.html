  salvarProduto(){
    const id = document.getElementById('prodId').value;
    const tipo = document.getElementById('prodTipo').value;
    const codigo = document.getElementById('prodCodigo').value.trim();
    const desc = document.getElementById('prodDesc').value.trim();
    const unidade = document.getElementById('prodUnidade').value;
    const cat = document.getElementById('prodCatSelect')?.value || 'Outros';

    if(!codigo || !desc){ toast('Código e Descrição são obrigatórios!', 'error'); return; }

    let prodObj = id ? DB.products.find(p => p.id === id) : null;
    const isNew = !prodObj;

    if(isNew){
      prodObj = { id: uid('p'), ativo: true };
      DB.products.push(prodObj);
    }

    prodObj.codigo = codigo;
    prodObj.descricao = desc;
    prodObj.unidade = unidade;
    prodObj.categoria = cat;
    prodObj.tipo = tipo;

    if(tipo === 'PA'){
      prodObj.linha = document.getElementById('prodLinha').value;
      prodObj.volumeXy = document.getElementById('prodVolXy').value;
      prodObj.eixoZ = document.getElementById('prodEixoZ').value;
      prodObj.precoReferencia = Math.round(parseFloat(document.getElementById('prodPrecoVenda').value || 0) * 100);
      prodObj.sinalEntradaCents = Math.round(parseFloat(document.getElementById('prodSinal').value || 0) * 100);
      prodObj.prazoFabricacaoDias = parseInt(document.getElementById('prodPrazoFab').value || 60, 10);
      prodObj.sobEncomenda = true;
      prodObj.produzivel = true;
      prodObj.estoqueMinimo = 0;
    } else {
      const custoCents = Math.round(parseFloat(document.getElementById('prodCusto').value || 0) * 100);
      const estMin = Math.round(parseFloat(document.getElementById('prodMin').value || 0) * 1000);
      const estMax = Math.round(parseFloat(document.getElementById('prodMax')?.value || 0) * 1000);
      const loc = document.getElementById('prodLoc')?.value || '';
      const fornId = document.getElementById('prodForn').value;

      prodObj.custoMedioCents = custoCents;
      prodObj.precoReferencia = custoCents;
      prodObj.estoqueMinimo = estMin;
      prodObj.estoqueMaximo = estMax;
      prodObj.localizacao = loc;
      prodObj.fornecedorId = fornId;
    }

    commit();
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    render();
    toast(`Produto ${codigo} ${isNew ? 'cadastrado' : 'atualizado'} com sucesso!`, 'success');
  },

  excluirCategoriaMaterial(catId){
    const cat = (DB.materialCategories||[]).find(c => c.id === catId);
    if(!cat) return;

    if(cat.sistema){
      toast('Categorias padrão do sistema não podem ser excluídas.', 'error');
      return;
    }

    const vinculados = (DB.products||[]).filter(p => p.categoria === cat.nome).length;
    if(vinculados > 0){
      dialog({
        title: 'Exclusão Bloqueada por Vínculo',
        width: 'max-w-md',
        body: `<div class="p-4 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-xs text-red-700 dark:text-red-300">
          Não é possível excluir. <b>${vinculados} itens</b> estão cadastrados nesta categoria. Reatribua-os antes de excluir.
        </div>`,
        footer: `${btn('Entendido', { variant: 'primary', action: 'this.closest(".fixed").remove()' })}`
      });
      return;
    }

    confirmDialog('Excluir Categoria', `Tem certeza que deseja excluir a categoria "${cat.nome}"?`, () => {
      DB.materialCategories = DB.materialCategories.filter(c => c.id !== catId);
      commit();

  salvarEntradaAvulsaMUC(){
    const prodId = document.getElementById('entMucProd').value;
    const qtdMilli = qtyToMilli(parseFloat(document.getElementById('entMucQtd').value || 0));
    const custoCents = Math.round(parseFloat(document.getElementById('entMucCusto').value || 0) * 100);
    const obs = document.getElementById('entMucObs').value.trim();

    if(qtdMilli <= 0 || custoCents < 0){ toast('Informe quantidade e custo válidos!', 'error'); return; }

    const p = DB.products.find(x => x.id === prodId);
    if(!p) return;

    const depCentral = DB.warehouses.find(w => w.ativo && w.tipo === 'materia_prima') || DB.warehouses[0];
    const saldoAtualMilli = DB.stockBalances.filter(b => b.productId === prodId && b.warehouseId === depCentral.id).reduce((a,b)=>a+b.quantidade,0);
    const custoAtualCents = p.custoMedioCents || p.precoReferencia || 0;

    const novoCustoMedio = Math.round(((saldoAtualMilli * custoAtualCents) + (qtdMilli * custoCents)) / (saldoAtualMilli + qtdMilli));
    p.custoMedioCents = novoCustoMedio;
    p.precoReferencia = novoCustoMedio;

    const movId = uid('mov');
    DB.stockMovements.push({
      id: movId,
      productId: prodId,
      warehouseId: depCentral.id,
      tipo: 'entrada_avulsa_muc',
      quantidade: qtdMilli,
      sinal: 1,
      custoUnitario: custoCents,
      origemTipo: 'entrada_avulsa',
      origemId: movId,
      observacao: obs,
      criadoEm: new Date().toISOString()
    });

    let bal = DB.stockBalances.find(b => b.productId === prodId && b.warehouseId === depCentral.id);
    if(!bal){
      bal = { id: uid('bal'), productId: prodId, warehouseId: depCentral.id, quantidade: 0, custoMedio: novoCustoMedio };
      DB.stockBalances.push(bal);
    }
    bal.quantidade += qtdMilli;
    bal.custoMedio = novoCustoMedio;

    // Re-avalia automáticos PCP de OPs aguardando material
    (DB.productionOrders || []).filter(o => o.status === 'aguardando_material').forEach(op => {
      App.avaliarNecessidadeMateriaisOP(op.id);
    });

    commit();
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    render();
    toast(`Entrada avulsa de ${formatMilliQty(qtdMilli, p.unidade)} registrada com sucesso!`, 'success');
  },

  salvarRequisicaoConsumoMUC(){
    const prodId = document.getElementById('reqMucProd').value;
    const qtdMilli = qtyToMilli(parseFloat(document.getElementById('reqMucQtd').value || 0));
    const setor = document.getElementById('reqMucSetor').value.trim();
    const obs = document.getElementById('reqMucObs').value.trim();

    if(qtdMilli <= 0){ toast('Informe uma quantidade válida!', 'error'); return; }

    const p = DB.products.find(x => x.id === prodId);
    if(!p) return;

    const depCentral = DB.warehouses.find(w => w.ativo && w.tipo === 'materia_prima') || DB.warehouses[0];
    const saldoDispMilli = DB.stockBalances.filter(b => b.productId === prodId && b.warehouseId === depCentral.id).reduce((a,b)=>a+b.quantidade,0);

    if(saldoDispMilli < qtdMilli){
      toast(`Saldo insuficiente! Disponível: ${formatMilliQty(saldoDispMilli, p.unidade)}.`, 'error');
      return;
    }

    const movId = uid('mov');
    const custoCents = p.custoMedioCents || p.precoReferencia || 0;

    DB.stockMovements.push({
      id: movId,
      productId: prodId,
      warehouseId: depCentral.id,
      tipo: 'saida_consumo_muc',

      criadoEm: new Date().toISOString()
    });

    let bal = DB.stockBalances.find(b => b.productId === prodId && b.warehouseId === depCentral.id);

  confirmarExcluirRegistro(entityType, id, nomeRegistro){
    let bloqueio = null;

    if (entityType === 'product') {
      const emBOM = (DB.bomItems || []).some(b => b.componentProductId === id || b.productId === id);
      const emSaldo = (DB.stockBalances || []).some(b => b.productId === id && b.quantidade > 0);
      const emOP = (DB.productionOrders || []).some(o => o.productId === id && o.status !== 'concluida');
      if (emBOM) bloqueio = 'O produto está cadastrado em Fichas Técnicas (BOM) ativas.';
      else if (emSaldo) bloqueio = 'O produto possui saldo físico positivo em estoque.';
      else if (emOP) bloqueio = 'O produto possui Ordens de Produção em andamento.';
    } else if (entityType === 'supplier') {
      const emPC = (DB.orders || []).some(o => o.supplierId === id && o.status !== 'concluido');
      if (emPC) bloqueio = 'O fornecedor possui Pedidos de Compra ativos.';
    } else if (entityType === 'customer') {
      const emPV = (DB.salesOrders || []).some(s => s.customerId === id && s.status !== 'cancelado');
      if (emPV) bloqueio = 'O cliente possui Pedidos de Venda em carteira.';
    } else if (entityType === 'salesOrder') {
      const emOP = (DB.productionOrders || []).some(o => o.salesOrderId === id && o.status !== 'concluida');
      if (emOP) bloqueio = 'O Pedido de Venda possui Ordens de Produção em andamento.';
    }

    if (bloqueio) {
      dialog({
        title: 'Exclusão Bloqueada por Dependências',
        width: 'max-w-md',
        body: `<div class="p-4 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-xs text-red-700 dark:text-red-300 space-y-2">
          <p class="font-bold flex items-center gap-1.5">${icon('alert', 'w-4 h-4')} Não é possível excluir "${esc(nomeRegistro)}"</p>
          <p>${esc(bloqueio)}</p>
        </div>`,
        footer: `${btn('Entendido', { variant: 'primary', action: 'this.closest(".fixed").remove()' })}`
      });
      return;
    }

    confirmDialog(
      'Confirmar Exclusão de Registro',
      `Tem certeza que deseja excluir "${nomeRegistro}"?\nEsta ação não pode ser desfeita.`,
      () => {
        if (entityType === 'product') DB.products = DB.products.filter(x => x.id !== id);
        else if (entityType === 'supplier') DB.suppliers = DB.suppliers.filter(x => x.id !== id);
        else if (entityType === 'customer') DB.customers = DB.customers.filter(x => x.id !== id);
        else if (entityType === 'user') DB.users = DB.users.filter(x => x.id !== id);
        else if (entityType === 'salesOrder') DB.salesOrders = DB.salesOrders.filter(x => x.id !== id);
        else if (entityType === 'productionOrder') DB.productionOrders = DB.productionOrders.filter(x => x.id !== id);
        else if (entityType === 'order') DB.orders = DB.orders.filter(x => x.id !== id);
        else if (entityType === 'quotation') DB.quotations = DB.quotations.filter(x => x.id !== id);
        else if (entityType === 'requisition') DB.requisitions = DB.requisitions.filter(x => x.id !== id);
        else if (entityType === 'bom') DB.bomVersions = DB.bomVersions.filter(x => x.id !== id);
        else if (entityType === 'warehouse') DB.warehouses = DB.warehouses.filter(x => x.id !== id);
        else if (entityType === 'workCenter') DB.workCenters = DB.workCenters.filter(x => x.id !== id);
        else if (entityType === 'ticket') DB.tickets = DB.tickets.filter(x => x.id !== id);

        commit();
        render();
        toast(`Registro "${nomeRegistro}" excluído com sucesso!`, 'success');
      },
      { danger: true, label: 'Excluir Definitivamente' }
    );
  },

  exportBackup(){
    DB.lastBackup = new Date().toISOString();
    save();
    const payload = JSON.stringify(DB, null, 2);
    // Envia automaticamente para a API do servidor local para replicar offsite
    fetch('/api/backup/dump', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payload
    }).catch(err => console.warn('[Backup] Sync local endpoint indisponível:', err));

    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `jp3d-backup-${today()}.json`;
    a.click();
    toast('Backup exportado e sincronizado offsite!', 'success');
    render();
  },
  triggerOffsiteDump(){
    DB.lastBackup = new Date().toISOString();
    save();
    toast('Iniciando dump do banco para pasta offsite...', 'info');
    fetch('/api/backup/dump', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DB, null, 2)
    }).then(res => res.json()).then(data => {
      if(data.success){
        toast('Dump Offsite concluído e replicado com sucesso!', 'success');
        render();
      } else {
        toast('Aviso ao gerar dump offsite.', 'warning');
      }
    }).catch(err => {
      console.error('[Backup] Erro ao disparar dump:', err);
      toast('Dump gerado localmente no navegador (Servidor HTTP offline)', 'info');
    });
  },
  importBackup(){
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json';
    inp.onchange = e => {
      const file = e.target.files[0];
      if(!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try{
          const imported = JSON.parse(ev.target.result);
          if(imported.users && imported.products){
            DB = imported;
            commit();
            toast('Dados restaurados com sucesso!', 'success');
          }
        }catch(err){ toast('Arquivo inválido!', 'error'); }
      };
      r.readAsText(file);
    };
    inp.click();
  },

      cidade: cid,
      uf,
      endereco: end,
      telefone: tel,

      seqPvPrefix: `PV-${uf}-`,
      seqOsPrefix: `OS-${uf}-`,
      seqTkPrefix: `TK-${uf}-`,
      ativo: true
    };

    if(!DB.companies) DB.companies = [DB.company];

  globalSearch(q){
    const box = document.getElementById('searchResults');
    if(!box) return;
    if(!q || q.length < 2){ box.classList.add('hidden'); return; }
    const matchQ = q.toLowerCase();
    const res = [];
    DB.products.filter(p=>p.descricao.toLowerCase().includes(matchQ)).slice(0,3).forEach(p=>res.push(['Produto', p.descricao, '/produtos']));
    DB.productionOrders.filter(o=>o.numero.toLowerCase().includes(matchQ)||o.modeloMaquina.toLowerCase().includes(matchQ)).slice(0,3).forEach(o=>res.push(['OP', `${o.numero} - ${o.modeloMaquina}`, '/producao']));
    DB.salesOrders.filter(s=>s.numero.toLowerCase().includes(matchQ)).slice(0,3).forEach(s=>res.push(['Venda', s.numero, '/vendas']));
    box.innerHTML = res.map(r=>`<a href="#${r[2]}" onclick="document.getElementById('searchResults').classList.add('hidden')" class="block px-3 py-2 text-xs hover:bg-slate-100 dark:hover:bg-slate-800 border-b border-slate-100 dark:border-slate-800/50"><span class="font-bold text-brand-600">${r[0]}:</span> ${esc(r[1])}</a>`).join('') || '<p class="p-3 text-xs text-slate-400">Nada encontrado</p>';
    box.classList.remove('hidden');
  },

  sincronizarListaMateriaisBOM(bomId){
    const bom = DB.bomVersions.find(b => b.id === bomId);
    if (!bom) return;
    const bomItems = DB.bomItems.filter(x => x.bomVersionId === bomId);
    bom.listaMateriais = bomItems.map(x => {
      const prod = DB.products.find(p => p.id === x.componentProductId);
      return {
        codigoItem: prod ? prod.codigo : '',
        componentProductId: x.componentProductId,
        quantidade: x.quantidade,
        tipo: prod ? (prod.tipo || 'MP') : 'MP',
        perdaPercentual: x.perdaPercentual,
        observacao: x.observacao || ''
      };
    });
  },

  atualizarQtdItemBOM(bomId, itemId, value){
    const item = DB.bomItems.find(i => i.id === itemId);
    if(!item) return;

    const qtdMilli = qtyToMilli(parseFloat(value) || 0);
    if(qtdMilli <= 0){
      toast('Informe uma quantidade necessária maior que zero.', 'error');
      return;
    }

    item.quantidade = qtdMilli;
    App.sincronizarListaMateriaisBOM(bomId);
    commit();
    toast('Quantidade necessária da BOM atualizada!', 'success');
  },

  salvarItemBOM(bomId){
    const compId = document.getElementById('addBomComp')?.value;
    const qtdMilli = qtyToMilli(parseFloat(document.getElementById('addBomQtd')?.value) || 1);
    const perdaCent = Math.round((parseFloat(document.getElementById('addBomPerda')?.value) || 0) * 100);
    const obs = document.getElementById('addBomObs')?.value.trim() || '';

    if (!compId) { toast('Selecione um material ou componente do estoque.', 'error'); return; }
    if (qtdMilli <= 0) { toast('Informe uma quantidade necessária maior que zero.', 'error'); return; }

    const existente = DB.bomItems.find(i => i.bomVersionId === bomId && i.componentProductId === compId);
    if (existente) {
      existente.quantidade += qtdMilli;
      if (obs) existente.observacao = obs;
    } else {
      DB.bomItems.push({
        id: uid('bomit'),
        bomVersionId: bomId,
        componentProductId: compId,
        quantidade: qtdMilli,
        perdaPercentual: perdaCent,
        opcional: false,
        observacao: obs
      });
    }

    App.sincronizarListaMateriaisBOM(bomId);
    commit();
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    toast('Material/Componente vinculado à Ficha Técnica com sucesso!', 'success');

  // Modais de Alerta e Reposição (Parte 6)
  gerarRequisicoesReposicaoLote(){
    const abertos = (DB.stockAlerts||[]).filter(a => ['aberto','reconhecido'].includes(a.status));
    if(!abertos.length){ toast('Nenhum alerta pendente de reposição.', 'info'); return; }
    for(const a of abertos){
      const prod = DB.products.find(p => p.id === a.productId);
      const falta = Math.max(0, (prod ? prod.estoqueMinimo : 0) - a.disponivelNoDisparo);
      const lote = prod?.consumoMedioDiario ? prod.consumoMedioDiario * 15 : (prod?.estoqueMinimo || 10000);
      const qtdPedir = Math.max(falta, lote);

      const reqId = uid('req');
      const reqNum = seq(DB.requisitions, 'seqReqPrefix', 'REQ-');
      DB.requisitions.push({
        id: reqId,
        numero: reqNum,
        solicitanteId: (DB.currentUser && DB.currentUser.id) || 'usr-compras',
        solicitanteNome: 'Alerta Estoque Mínimo',
        setor: 'Suprimentos',
        prioridade: a.nivel === 'zerado' ? 'urgente' : 'alta',
        status: 'aprovada',
        observacoes: `Reposição automática do alerta de estoque mínimo (${a.nivel.toUpperCase()})`,
        criadoEm: today()
      });
      DB.requisitionItems.push({
        id: uid('reqit'),
        requisitionId: reqId,
        productId: a.productId,
        descricao: prod ? prod.descricao : 'Item de Reposição',
        unidade: prod ? prod.unidade : 'UN',
        quantidade: qtdPedir,
        precoEstimado: prod ? prod.precoReferencia : 0
      });
      a.status = 'em_reposicao';
      a.atualizadoEm = new Date().toISOString();
    }
    commit();
    toast(`${abertos.length} Requisição(ões) de Reposição gerada(s)!`, 'success');
  },

  /* Módulo Gescomp — Integração Supabase & Local Fallback */
  getSupabaseClient(){
    if(window._supabaseClient) return window._supabaseClient;
    const url = window.VITE_SUPABASE_URL || (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_URL) || localStorage.getItem('VITE_SUPABASE_URL') || '';
    const key = window.VITE_SUPABASE_ANON_KEY || (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_ANON_KEY) || localStorage.getItem('VITE_SUPABASE_ANON_KEY') || '';
    if(typeof supabase !== 'undefined' && url && key){
      try {
        window._supabaseClient = supabase.createClient(url, key);
        return window._supabaseClient;
      } catch(e) { console.warn('[Supabase] Init error:', e); }
    }
    return null;
  },

  addGescompTask(e){
    e.preventDefault();
    const u = getCurrentUser();
    if(!u) return;
    const input = document.getElementById('gescompTaskInput');
    const text = input ? input.value.trim() : '';
    if(!text) return;
    if(!DB.gescompTasks) DB.gescompTasks = [];
    const newTask = {
      id: uid('gtask'),
      userId: u.id,
      text,
      completed: false,
      createdAt: new Date().toISOString()
    };
    DB.gescompTasks.unshift(newTask);
    commit();
    input.value = '';

    const sb = App.getSupabaseClient();
    if(sb){
      sb.from('tasks').insert([{ texto: text, concluido: false, usuario_id: u.id }])
        .then(({ error }) => { if(error) console.warn('[Supabase Tasks Insert Error]', error); });
    }
    toast('Tarefa adicionada à sua lista Gescomp!', 'success');
  },
  toggleGescompTask(taskId){
    const t = (DB.gescompTasks||[]).find(x => x.id === taskId);
    if(t){
      t.completed = !t.completed;
      commit();
      const sb = App.getSupabaseClient();
      if(sb){
        sb.from('tasks').update({ concluido: t.completed }).eq('id', taskId)
          .then(({ error }) => { if(error) console.warn('[Supabase Tasks Update Error]', error); });
      }
    }
  },
  deleteGescompTask(taskId){
    DB.gescompTasks = (DB.gescompTasks||[]).filter(x => x.id !== taskId);
    commit();
    const sb = App.getSupabaseClient();
    if(sb){
      sb.from('tasks').delete().eq('id', taskId)
        .then(({ error }) => { if(error) console.warn('[Supabase Tasks Delete Error]', error); });
    }
    toast('Tarefa removida.', 'info');
  },
  clearCompletedGescompTasks(){
    const u = getCurrentUser();
    if(!u) return;
    DB.gescompTasks = (DB.gescompTasks||[]).filter(x => x.userId !== u.id || !x.completed);
    commit();
    const sb = App.getSupabaseClient();
    if(sb){
      sb.from('tasks').delete().eq('usuario_id', u.id).eq('concluido', true)
        .then(({ error }) => { if(error) console.warn('[Supabase Tasks Delete Completed Error]', error); });
    }
    toast('Tarefas concluídas removidas.', 'info');
  },

      completed: false,
      createdAt: new Date().toISOString()
    };
    DB.gescompShoppingList.unshift(newItem);
    commit();
    descInput.value = '';
    qtdInput.value = '1';

    const sb = App.getSupabaseClient();
    if(sb){
      sb.from('compras').insert([{ texto: text, quantidade, concluido: false, usuario_id: u.id }])
        .then(({ error }) => { if(error) console.warn('[Supabase Compras Insert Error]', error); });
    }
    toast('Item adicionado à sua lista de compras Gescomp!', 'success');
  },
  toggleGescompShoppingItem(itemId){
    const i = (DB.gescompShoppingList||[]).find(x => x.id === itemId);
    if(i){
      i.completed = !i.completed;
      commit();
      const sb = App.getSupabaseClient();
      if(sb){
        sb.from('compras').update({ concluido: i.completed }).eq('id', itemId)
          .then(({ error }) => { if(error) console.warn('[Supabase Compras Update Error]', error); });
      }
    }
  },
  deleteGescompShoppingItem(itemId){
    DB.gescompShoppingList = (DB.gescompShoppingList||[]).filter(x => x.id !== itemId);
    commit();
    const sb = App.getSupabaseClient();
    if(sb){
      sb.from('compras').delete().eq('id', itemId)
        .then(({ error }) => { if(error) console.warn('[Supabase Compras Delete Error]', error); });
    }
    toast('Item removido.', 'info');
  },
  clearCompletedGescompShopping(){
    const u = getCurrentUser();
    if(!u) return;
    DB.gescompShoppingList = (DB.gescompShoppingList||[]).filter(x => x.userId !== u.id || !x.completed);
    commit();
    const sb = App.getSupabaseClient();
    if(sb){
      sb.from('compras').delete().eq('usuario_id', u.id).eq('concluido', true)
        .then(({ error }) => { if(error) console.warn('[Supabase Compras Delete Completed Error]', error); });
    }
    toast('Itens concluídos removidos.', 'info');
  },

  gescompClearAll(tab='tasks'){
    confirmDialog(
      'Limpar Todas as Listas Gescomp',
      'Deseja limpar permanentemente todas as suas tarefas e lista de compras?',
      () => {
        const u = getCurrentUser();
        if(!u) return;
        DB.gescompTasks = (DB.gescompTasks||[]).filter(x => x.userId !== u.id);
        DB.gescompShoppingList = (DB.gescompShoppingList||[]).filter(x => x.userId !== u.id);
        commit();
        toast('Listas limpas com sucesso!', 'info');
      },
      { danger: true, label: 'Limpar Tudo' }
    );
  }
};

/* ============================ ROTEAMENTO & RENDER ============================ */
let ROUTE = { path: '/', params: {} };

function parseHash(){
  const h = window.location.hash.slice(1) || '/';
  const [path, queryString] = h.split('?');
  const params = {};
  if(queryString){
    queryString.split('&').forEach(pair => {
      const [k, v] = pair.split('=');
      params[k] = decodeURIComponent(v || '');
    });
  }
  return { path, params };
}

function render(){
  ROUTE = parseHash();
  const u = getCurrentUser();
  if(!u){
    document.getElementById('loginScreen').classList.remove('hidden');
    App.loadSavedUser();
    return;
  }
  document.getElementById('loginScreen').classList.add('hidden');

  let content;
  if(ROUTE.path==='/' || ROUTE.path==='') content = viewDashboard();
  else if(ROUTE.path==='/gescomp' || ROUTE.path==='/tarefas') content = viewGescomp();
  else if(ROUTE.path==='/crm') content = viewCRM();
  else if(ROUTE.path==='/fluxo') content = viewPipelineFluxo();
  else if(ROUTE.path==='/vendas') content = viewVendas();
  else if(ROUTE.path==='/producao') content = viewProducao();
  else if(ROUTE.path==='/chao-de-fabrica') content = viewChaoDeFabrica();
  else if(ROUTE.path==='/estoque') content = viewEstoque();
  else if(ROUTE.path==='/suporte') content = viewSuporte();
  else if(ROUTE.path==='/cotacoes') content = viewCotacoes();
  else if(ROUTE.path==='/pedidos') content = viewOrders();
  else if(ROUTE.path==='/fichas-tecnicas' || ROUTE.path==='/fichas') content = viewFichasTecnicas();
  else if(ROUTE.path==='/centros-trabalho') content = viewCentrosTrabalho();
  else if(ROUTE.path==='/depositos') content = viewDepositos();
  else if(ROUTE.path==='/clientes') content = viewClientes();
  else if(ROUTE.path==='/fornecedores') content = viewSuppliers();
  else if(ROUTE.path==='/produtos') content = viewProducts();
  else if(ROUTE.path==='/config') content = viewConfig();
  else content = notFound();

  document.getElementById('root').innerHTML = shell(content);
}

window.App = App;
window.addEventListener('hashchange', render);
window.addEventListener('load', () => {
  avaliarEstoqueMinimoEmLote();
  render();
});
</script>
