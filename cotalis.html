/* ============================ UNIDADES & FORMATADORES (shared/units.ts) ============================ */
function brlToCents(brl){
  if(typeof brl === 'number') return Math.round(brl * 100);
  if(!brl) return 0;
  const clean = String(brl).replace(/[^0-9,-]/g, '').replace(',', '.');
  const num = parseFloat(clean);
  return isNaN(num) ? 0 : Math.round(num * 100);
}
function centsToBRL(cents){
  if(cents === null || cents === undefined) return 'R$ 0,00';
  const val = cents / 100;
  return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function qtyToMilli(qty){
  if(typeof qty === 'number') return Math.round(qty * 1000);
  if(!qty) return 0;
  const clean = String(qty).replace(/[^0-9,-]/g, '').replace(',', '.');
  const num = parseFloat(clean);
  return isNaN(num) ? 0 : Math.round(num * 1000);
}
function milliToQty(milli){
  if(milli === null || milli === undefined) return 0;
  return milli / 1000;
}
function formatMilliQty(milli, unit='UN'){
  const q = milliToQty(milli);
  if(['UN','PC','CX'].includes(unit.toUpperCase())){
    return q.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 3 }) + ' ' + unit;
  }
  return q.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 3 }) + ' ' + unit;
}
const money = c => centsToBRL(c);
const qty = m => milliToQty(m);

}

/* ============================ M-02: VERSÃO DE SCHEMA ============================ */
const SCHEMA_VERSION = 5; // Incrementar a cada mudança de estrutura do DB

function migrateDB(db) {
  const v = db.schemaVersion || 0;
  // Migração v0→v1: garantir campo pontoReposicao nos produtos
  if (v < 1) {
    (db.products || []).forEach(p => { if (!p.pontoReposicao) p.pontoReposicao = p.estoqueMinimo * 1.5 | 0; });
  }
  // Migração v1→v2: garantir campo preferences nos usuários
  if (v < 2) {
    (db.users || []).forEach(u => { if (!u.preferences) u.preferences = { sidebarCollapsed: false }; });
  }
  // Migração v2→v3: garantir contadores seq no company
  if (v < 3) {
    if (db.company) {
      db.company.seqReq = db.company.seqReq || (db.requisitions || []).length;
      db.company.seqCot = db.company.seqCot || (db.quotations || []).length;
      db.company.seqPc  = db.company.seqPc  || (db.orders || []).length;
      db.company.seqOp  = db.company.seqOp  || (db.productionOrders || []).length;
      db.company.seqPv  = db.company.seqPv  || (db.salesOrders || []).length;
      db.company.seqOs  = db.company.seqOs  || (db.pickingOrders || []).length;
      db.company.seqTk  = db.company.seqTk  || (db.tickets || []).length;
    }
  }
  // Migração v4→v5: Estoque Expandido (MP, MUC, PA) + Categorias Dinâmicas + Logos
  if (v < 5) {
    if (!db.materialCategories || !db.materialCategories.length) {
      db.materialCategories = structuredClone(EMPTY.materialCategories);
    }
    (db.products || []).forEach(p => {
      if (!p.tipo) {
        if (p.tipoItem === 'produto_acabado' || p.categoria === 'Impressora 3D' || p.linha) {
          p.tipo = 'PA';
        } else if (p.tipoItem === 'materia_prima' && (p.codigo.startsWith('MUC-') || (p.categoria && p.categoria.includes('Teste')))) {
          p.tipo = 'MUC';
        } else {
          p.tipo = 'MP';
        }
      }
    });
    (EMPTY.products || []).forEach(ep => {
      if (!db.products.some(p => p.id === ep.id || p.codigo === ep.codigo)) {
        db.products.push(structuredClone(ep));
      }
    });
    (EMPTY.stockMovements || []).forEach(em => {
      if (!db.stockMovements.some(m => m.id === em.id)) {
        db.stockMovements.push(structuredClone(em));
      }
    });
  }
  db.schemaVersion = SCHEMA_VERSION;
  // B-03 FIX: sempre recalcular saldos do razão ao carregar — garantia de consistência
  recalcularSaldosDoRazao(db);
  return db;
}

// B-03: Recalcula stockBalances inteiramente a partir de stockMovements (razão append-only)
function recalcularSaldosDoRazao(db){
  const agg = {};
  const whCompanyMap = (db.warehouses || []).reduce((acc, w) => { acc[w.id] = w.companyId || 'comp-1'; return acc; }, {});

  for(const m of (db.stockMovements || [])){
    const compId = m.companyId || whCompanyMap[m.warehouseId] || db.currentCompanyId || 'comp-1';
    const k = m.productId + '|' + m.warehouseId + '|' + compId;

    if(!agg[k]) agg[k] = { quantidade: 0, custoTotal: 0, compId };
    const delta = (m.quantidade || 0) * (m.sinal || 1);
    agg[k].quantidade += delta;
    if(delta > 0) agg[k].custoTotal += delta * (m.custoUnitario || 0);
  }

  const novosBalances = [];
  for(const [k, val] of Object.entries(agg)){
    const [productId, warehouseId, compId] = k.split('|');
    const qtdFinal = Math.max(0, Math.round(val.quantidade));
    const custoMedio = qtdFinal > 0 ? Math.round(val.custoTotal / val.quantidade) : 0;
    const existing = (db.stockBalances || []).find(b => b.productId === productId && b.warehouseId === warehouseId && b.companyId === compId);

    novosBalances.push({
      id: existing ? existing.id : 'bal-' + productId + '-' + warehouseId + '-' + compId,
      productId,
      warehouseId,
      companyId: compId,
      locationId: existing ? existing.locationId : null,
      quantidade: qtdFinal,
      custoMedio
    });
  }
  db.stockBalances = novosBalances;
}

/* ============================ FUNÇÃO PURA DE ESTOQUE MÍNIMO COM HISTERESE (PARTE 6) ============================ */
function nivelEstoque(disponivel, minimo, pontoReposicao, options={}){
  // A-03 FIX: aceita nivelAtual (correto) OU emAlertaAnteriormente (legado) para histerese
  const nivelAtual = options.nivelAtual || null;
  const emAlertaAnteriormente = options.emAlertaAnteriormente || (nivelAtual && nivelAtual !== 'ok') || false;
  const histeresePercent = options.histeresePercent !== undefined ? options.histeresePercent : 0.05;

  if (disponivel <= 0) return 'zerado';
  if (disponivel < minimo) return 'critico';

  if (emAlertaAnteriormente) {
    // Histerese: só resolve se disponivel >= minimo * 1.05 (5% acima do mínimo)
    const limiarResolucao = Math.round(minimo * (1 + histeresePercent));
    if (disponivel < limiarResolucao) return 'atencao';
  }

  if (pontoReposicao !== null && pontoReposicao !== undefined && pontoReposicao > minimo) {
    if (disponivel <= pontoReposicao) return 'atencao';
  }

  return 'ok';
}

/* ============================ MOTOR DE PRECIFICAÇÃO (shared/pricing.ts) ============================ */
const PricingEngine = {
  calcularParcelamentoExato(totalCentavos, numeroParcelas, valorAVistaCentavos=null){
    if(!numeroParcelas || numeroParcelas <= 0) numeroParcelas = 1;
    const total = Math.max(0, Math.round(totalCentavos));
    const baseParcela = Math.floor(total / numeroParcelas);
    const parcelas = [];
    let somaParcial = 0;
    for(let i=1; i<numeroParcelas; i++){
      parcelas.push({ numero: i, valorCentavos: baseParcela, valorFormatado: centsToBRL(baseParcela) });
      somaParcial += baseParcela;
    }
    const ultimaParcela = total - somaParcial;
    parcelas.push({ numero: numeroParcelas, valorCentavos: ultimaParcela, valorFormatado: centsToBRL(ultimaParcela) });

    let acrescimoCentavos = 0;
    let acrescimoBps = 0; // B-02 FIX: basis points inteiros (percentual × 100) — sem float
    if(valorAVistaCentavos && valorAVistaCentavos > 0){
      acrescimoCentavos = Math.max(0, total - valorAVistaCentavos);
      // Basis points: 100bps = 1%. Arredonda para inteiro — zero float em aritmética de negócio.
      acrescimoBps = Math.round(((total - valorAVistaCentavos) * 10000) / valorAVistaCentavos);
    }

    return {
      totalCentavos: total,
      numeroParcelas,
      acrescimoCentavos,
      acrescimoBps,                                      // inteiro (ex: 150 = 1,50%)
      acrescimoPercentual: acrescimoBps / 100,           // somente display — NÃO usar em cálculo
      parcelas,
      valorParcelaBaseCentavos: baseParcela,
      valorUltimaParcelaCentavos: ultimaParcela,
      somaExataCentavos: somaParcial + ultimaParcela
    };
  }
};

let DB = load();
function load(){
  try{
    const raw = localStorage.getItem('gescomp.db') || localStorage.getItem('cotalis.db');
    if(!raw) return migrateDB(structuredClone(EMPTY));
    const parsed = JSON.parse(raw);
    // Deep merge: campos novos do EMPTY não são sobrescritos por dados antigos
    const db = Object.assign(structuredClone(EMPTY), parsed);
    if(!db.users || !db.users.length) db.users = structuredClone(EMPTY.users);
    const adm = db.users.find(u => u.roleId === 'role-admin' || u.name.toLowerCase() === 'admin');
    if(adm){ adm.name = 'admin'; adm.password = '041219'; }
    if(!db.roles || !db.roles.length) db.roles = structuredClone(DEFAULT_ROLES);
    // M-02: aplicar migrações de schema
    return migrateDB(db);
  }catch(e){
    console.error('[Gescomp] Erro ao carregar DB:', e);
    return migrateDB(structuredClone(EMPTY));
  }
}
function save(){
  // M-03: podar notificações acima de 500 (mantém as mais recentes)
  if(DB.notifications && DB.notifications.length > 500){
    DB.notifications = DB.notifications.slice(-500);
  }
  try {
    localStorage.setItem('gescomp.db', JSON.stringify(DB));
    localStorage.setItem('cotalis.db', JSON.stringify(DB));
    // Sincronização em tempo real com o backend Express / SQLite (data.db)
    const token = sessionStorage.getItem('jp3d_token');
    fetch('/api/backup/dump', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
      },
      body: JSON.stringify(DB)
    }).catch(err => console.warn('[Gescomp Sync] Backend temporariamente indisponível:', err));
  } catch(e) {
    console.error('[Gescomp] Falha ao salvar no localStorage (possivelmente cheio):', e);
    // Último recurso: podar mais agressivamente e tentar novamente
    if(DB.notifications) DB.notifications = DB.notifications.slice(-100);
    if(DB.history) DB.history = DB.history.slice(-200);
    try { 
      localStorage.setItem('gescomp.db', JSON.stringify(DB)); 
      localStorage.setItem('cotalis.db', JSON.stringify(DB));
    } catch(e2) {
      console.error('[Gescomp] Falha crítica de persistência.', e2);
    }
  }
}
function commit(){ save(); render(); }

// B-01 FIX: Transação atômica — fn pode lançar exceção sem corromper o estado salvo
function transact(fn) {
  const snapshot = JSON.stringify(DB);
  try {
    fn();
    save();
  } catch(e) {
    // Rollback: restaura o estado anterior integralmente
    try { DB = JSON.parse(snapshot); } catch(_){}
    console.error('[Cotalis] Transação revertida:', e);
    throw e;
  }
}

// A-04 FIX: seq() com contador atômico no DB.company — sem depender de list.length
function seq(list, prefixKey='seqCotPrefix', fallback='COT-'){
  const p = (DB.company && DB.company[prefixKey]) || fallback;
  // Mapeamento prefixKey → contador atômico no company
  const counterMap = {
    seqReqPrefix: 'seqReq', seqCotPrefix: 'seqCot', seqPcPrefix: 'seqPc',
    seqOpPrefix: 'seqOp',   seqPvPrefix:  'seqPv',  seqOsPrefix: 'seqOs', seqTkPrefix: 'seqTk'
  };
  const counterKey = counterMap[prefixKey];
  let n;
  if(counterKey && DB.company) {
    if(typeof DB.company[counterKey] !== 'number') DB.company[counterKey] = list.length;
    DB.company[counterKey]++;
    n = DB.company[counterKey];
  } else {
    // Fallback para prefixos desconhecidos
    n = list.length + 1;
  }
  return p + String(n).padStart(4,'0');
}

function getCurrentUser(){
  if(DB.currentUser) return DB.currentUser;
  const authId = sessionStorage.getItem('jp3d_user_id');
  if(authId){
    const u = DB.users.find(x => x.id === authId && x.active);
    if(u){ DB.currentUser = u; return u; }
  }
  return null;
}
function getUserRole(user){
  if(!user) return null;
  return DB.roles.find(r => r.id === user.roleId) || DB.roles[0];
}
function userHasPermission(user, permissionKey){
  if(!user) return false;
  const role = getUserRole(user);
  if(user.roleId === 'super_admin' || user.roleId === 'role-admin' || role?.id === 'role-admin' || role?.id === 'super_admin') return true;

  if(Array.isArray(user.permissoes)){
    if(user.permissoes.includes('*')) return true;
    if(user.permissoes.includes(permissionKey)) return true;
    if(permissionKey.startsWith('nav.')){
      const rawPath = '/' + permissionKey.replace('nav.','').replace('.ver','');
      const cleanPath = rawPath === '/dashboard' ? '/' : rawPath;
      if(user.permissoes.includes(cleanPath)) return true;
    }
  }

  const userOverrides = (DB.userPermissionOverrides && DB.userPermissionOverrides[user.id]) || {};
  if(userOverrides[permissionKey] === 'allow') return true;
  if(userOverrides[permissionKey] === 'deny') return false;

  const rolePerms = (role && role.permissions) || [];
  return rolePerms.includes(permissionKey);
}
function can(permissionKey){
  return userHasPermission(getCurrentUser(), permissionKey);
}
function canEditInlineTexts(){
  const u = getCurrentUser();
  if(!u) return false;
  const role = getUserRole(u);
  return u.roleId === 'super_admin' || u.roleId === 'role-admin' || role?.id === 'role-admin' || role?.id === 'super_admin';
}

// 1. Estoque Mínimo & Alertas (Parte 6)
function avaliarEstoqueMinimo(productId, options={}){
  const prod = DB.products.find(p => p.id === productId);
  if(!prod || !prod.ativo) return null;

  const depValidos = DB.warehouses.filter(w => w.ativo && !['refugo','terceiros'].includes(w.tipo)).map(w => w.id);
  const saldoFisico = DB.stockBalances
    .filter(b => b.productId === productId && depValidos.includes(b.warehouseId))
    .reduce((acc, b) => acc + b.quantidade, 0);

  const reservadoAtivo = DB.stockReservations
    .filter(r => r.productId === productId && r.status === 'ativa')
    .reduce((acc, r) => acc + r.quantidade, 0);

  const disponivel = saldoFisico - reservadoAtivo;
  const alertaAberto = DB.stockAlerts.find(a => a.productId === productId && ['aberto','reconhecido','em_reposicao','silenciado'].includes(a.status));
  const emAlerta = !!alertaAberto;

  const nivel = nivelEstoque(disponivel, prod.estoqueMinimo, prod.pontoReposicao, { nivelAtual: alertaAberto ? alertaAberto.nivel : null });

  if(nivel === 'ok'){
    if(alertaAberto){
      alertaAberto.status = 'resolvido';
      alertaAberto.atualizadoEm = new Date().toISOString();
      DB.stockAlertEvents.push({ id: uid('altev'), alertId: alertaAberto.id, tipo: 'resolvido', nivelNovo: 'ok', disponivel, criadoEm: new Date().toISOString() });
    }
    return { productId, nivel: 'ok', disponivel, alerta: null };
  }

  if(alertaAberto){
    if(alertaAberto.nivel !== nivel){
      const nivelAntigo = alertaAberto.nivel;
      alertaAberto.nivel = nivel;
      alertaAberto.atualizadoEm = new Date().toISOString();
      DB.stockAlertEvents.push({ id: uid('altev'), alertId: alertaAberto.id, tipo: 'mudanca_nivel', nivelAntigo, nivelNovo: nivel, disponivel, criadoEm: new Date().toISOString() });
      if(['critico','zerado'].includes(nivel) && nivelAntigo === 'atencao'){
        DB.notifications.push({ id: uid('notif'), tipo: 'alerta_estoque', titulo: `Estoque Crítico: ${prod.descricao}`, mensagem: `Disponível: ${formatMilliQty(disponivel, prod.unidade)}. Nível agravado para ${nivel.toUpperCase()}.`, documentoTipo: 'product', documentoId: productId, lidaEm: null, criadoEm: new Date().toISOString() });
      }
    }
    return { productId, nivel, disponivel, alerta: alertaAberto };
  }

  const novoAlerta = {
    id: uid('alt'),
    productId,
    nivel,
    disponivelNoDisparo: disponivel,
    estoqueMinimoNoDisparo: prod.estoqueMinimo,
    pontoReposicaoNoDisparo: prod.pontoReposicao,
    origemTipo: options.origemTipo || 'consumo',
    origemId: options.origemId || null,
    status: 'aberto',
    criadoEm: new Date().toISOString(),
    atualizadoEm: new Date().toISOString(),
    silenciadoAte: null
  };
  DB.stockAlerts.push(novoAlerta);
  DB.stockAlertEvents.push({ id: uid('altev'), alertId: novoAlerta.id, tipo: 'aberto', nivelNovo: nivel, disponivel, criadoEm: new Date().toISOString() });

  if(['critico','zerado'].includes(nivel)){
    DB.notifications.push({ id: uid('notif'), tipo: 'alerta_estoque', titulo: `Estoque ${nivel === 'zerado' ? 'ZERADO' : 'CRÍTICO'}: ${prod.descricao}`, mensagem: `Disponível: ${formatMilliQty(disponivel, prod.unidade)} (Mínimo: ${formatMilliQty(prod.estoqueMinimo, prod.unidade)}).`, documentoTipo: 'product', documentoId: productId, lidaEm: null, criadoEm: new Date().toISOString() });
  }

  return { productId, nivel, disponivel, alerta: novoAlerta };
}

function avaliarEstoqueMinimoEmLote(productIds){
  const prods = productIds ? DB.products.filter(p => productIds.includes(p.id)) : DB.products;
  return prods.map(p => avaliarEstoqueMinimo(p.id));
}

// 2. Ficha Técnica Recursiva (BOM)
function explodirFichaTecnica(productId, quantidadeMilli, bomVersionId=null, visitados=new Set()){
  let bom = null;
  if(bomVersionId) bom = DB.bomVersions.find(b => b.id === bomVersionId);
  else bom = DB.bomVersions.find(b => b.productId === productId && b.status === 'ativa');
  if(!bom) return [];

  if(visitados.has(bom.id)) throw new Error(`Ciclo detectado na Ficha Técnica ${bom.versao}`);
  visitados.add(bom.id);

  const itens = DB.bomItems.filter(i => i.bomVersionId === bom.id);
  const resultado = [];
  const fatorPai = quantidadeMilli / 1000;

  for(const it of itens){
    const perdaFator = 1 + (it.perdaPercentual || 0) / 10000;
    const qtdNecessaria = Math.round(it.quantidade * fatorPai * perdaFator);
    resultado.push({
      componentProductId: it.componentProductId,
      quantidadeNecessaria: qtdNecessaria,
      bomItemId: it.id,
      opcional: it.opcional
    });
  }
  return resultado;
}

function gerarRequisicaoDeFalta(opId, reqItensFalta, prioridade='alta'){
  const op = DB.productionOrders.find(o => o.id === opId);
  const newReqId = uid('req');
  const newReqNum = seq(DB.requisitions, 'seqReqPrefix', 'REQ-');
  DB.requisitions.push({
    id: newReqId,
    numero: newReqNum,
    solicitanteId: (DB.currentUser && DB.currentUser.id) || 'usr-producao',
    solicitanteNome: (DB.currentUser && DB.currentUser.name) || 'Engenharia JP3D',
    setor: 'Produção',
    prioridade: prioridade === 'urgente' ? 'urgente' : 'alta',
    status: 'aprovada',
    observacoes: `Falta de componentes gerada pela explosão da ${op ? op.numero : 'OP'}`,
    criadoEm: today()
  });
  for(const f of reqItensFalta){
    const prod = DB.products.find(p => p.id === f.componentProductId);
    DB.requisitionItems.push({
      id: uid('reqit'),
      requisitionId: newReqId,
      productId: f.componentProductId,
      descricao: prod ? prod.descricao : 'Insumo 3D',
      unidade: prod ? prod.unidade : 'UN',
      quantidade: f.quantidade,
      precoEstimado: prod ? prod.precoReferencia : 0
    });
  }
  return newReqId;
}

function criarOrdemProducao(params){
  const { salesOrderId, salesOrderItemId, productId, modeloMaquina, bomVersionId, quantidade, prioridade='normal', dataPrevistaInicio, dataPrevistaFim } = params;
  const opId = uid('op');
  const numero = seq(DB.productionOrders, 'seqOpPrefix', 'OP-');

  const componentes = explodirFichaTecnica(productId, quantidade, bomVersionId);
  let statusInicial = 'liberada';
  const materiaisOP = [];
  const reqItensFalta = [];

  for(const c of componentes){
    const depMateriaPrima = DB.warehouses.find(w => w.ativo && w.tipo === 'materia_prima') || DB.warehouses[0];
    const saldoDisp = DB.stockBalances
      .filter(b => b.productId === c.componentProductId && b.warehouseId === depMateriaPrima.id)
      .reduce((acc, b) => acc + b.quantidade, 0);
    const reservado = DB.stockReservations
      .filter(r => r.productId === c.componentProductId && r.status === 'ativa')
      .reduce((acc, r) => acc + r.quantidade, 0);
    const realDisponivel = Math.max(0, saldoDisp - reservado);

    const qtdReservar = Math.min(realDisponivel, c.quantidadeNecessaria);
    const qtdFalta = c.quantidadeNecessaria - qtdReservar;

    if(qtdReservar > 0){
      DB.stockReservations.push({
        id: uid('res'),
        productId: c.componentProductId,
        warehouseId: depMateriaPrima.id,
        quantidade: qtdReservar,
        origemTipo: 'ordem_producao',
        origemId: opId,
        status: 'ativa',
        criadoEm: new Date().toISOString()
      });
    }

    if(qtdFalta > 0){
      statusInicial = 'aguardando_material';
      reqItensFalta.push({
        componentProductId: c.componentProductId,
        quantidade: qtdFalta
      });
    }

    materiaisOP.push({
      id: uid('opmat'),
      productionOrderId: opId,
      componentProductId: c.componentProductId,
      quantidadeNecessaria: c.quantidadeNecessaria,
      quantidadeReservada: qtdReservar,
      quantidadeSeparada: 0,
      quantidadeConsumida: 0,
      faltaQuantidade: qtdFalta,
      requisitionId: null
    });

    avaliarEstoqueMinimo(c.componentProductId, { origemTipo: 'reserva', origemId: opId });
  }

  const novaOP = {
    id: opId,
    numero,
    salesOrderId: salesOrderId || null,
    salesOrderItemId: salesOrderItemId || null,
    productId,
    modeloMaquina: modeloMaquina || 'Personalizado',
    bomVersionId: bomVersionId || null,
    quantidade,
    quantidadeProduzida: 0,
    quantidadeRefugo: 0,
    prioridade,
    dataPrevistaInicio: dataPrevistaInicio || today(),
    dataPrevistaFim: dataPrevistaFim || today(),
    status: statusInicial,
    tipo: 'normal',
    criadoEm: today()
  };

  DB.productionOrders.push(novaOP);

  if(reqItensFalta.length > 0){
    const reqId = gerarRequisicaoDeFalta(opId, reqItensFalta, prioridade);
    materiaisOP.forEach(m => { if(m.faltaQuantidade > 0) m.requisitionId = reqId; });
  }

  materiaisOP.forEach(m => DB.productionOrderMaterials.push(m));
  log('production_order', opId, `Ordem de Produção ${numero} criada com status ${statusInicial.toUpperCase()}.`);
  return novaOP;
}

function gerarOSSeparacao(opId, responsavelId=null){
  const op = DB.productionOrders.find(o => o.id === opId);
  if(!op) throw new Error('OP não encontrada.');

  const mats = DB.productionOrderMaterials.filter(m => m.productionOrderId === opId && m.quantidadeReservada > m.quantidadeSeparada);
  if(!mats.length) throw new Error('Não há materiais reservados pendentes de separação para esta OP.');

  const osId = uid('os');
  const osNumero = seq(DB.pickingOrders, 'seqOsPrefix', 'OS-');
  const novaOS = {
    id: osId,
    numero: osNumero,
    productionOrderId: opId,
    status: 'aberta',
    responsavelId,
    criadoEm: new Date().toISOString(),
    observacoes: `Separação de materiais para ${op.numero}`
  };
  DB.pickingOrders.push(novaOS);

  for(const m of mats){
    const qtdSolicitar = m.quantidadeReservada - m.quantidadeSeparada;
    const loc = DB.locations.find(l => l.warehouseId === 'wh-1') || DB.locations[0];
    DB.pickingItems.push({
      id: uid('pkit'),
      pickingOrderId: osId,
      productionOrderMaterialId: m.id,
      componentProductId: m.componentProductId,
      warehouseId: 'wh-1',
      locationId: loc ? loc.id : null,
      quantidadeSolicitada: qtdSolicitar,
      quantidadeSeparada: 0,
      status: 'pendente'
    });
  }

  op.status = 'separacao_pendente';
  log('picking_order', osId, `Ordem de Separação ${osNumero} gerada para a ${op.numero}.`);
  return novaOS;
}

function confirmarSeparacao(osId, itensSeparados, usuarioId=null){
  const os = DB.pickingOrders.find(o => o.id === osId);
  if(!os) throw new Error('OS não encontrada.');
  const op = DB.productionOrders.find(o => o.id === os.productionOrderId);

  // M-04 FIX: coletar productIds afetados para chamar avaliarEstoqueMinimo uma única vez fora do loop
  const produtosAfetados = new Set();

  // B-01 FIX: toda a mutação envolve em transact — rollback automático em caso de falha
  transact(() => {
    for(const item of itensSeparados){
      const pkItem = DB.pickingItems.find(p => p.id === item.pickingItemId);
      if(!pkItem) continue;

      pkItem.quantidadeSeparada = item.quantidadeSeparada;
      pkItem.status = item.quantidadeSeparada >= pkItem.quantidadeSolicitada ? 'separado' : 'divergente';

      const mat = DB.productionOrderMaterials.find(m => m.id === pkItem.productionOrderMaterialId);
      if(mat){
        mat.quantidadeSeparada += item.quantidadeSeparada;
        mat.quantidadeConsumida += item.quantidadeSeparada;
      }

      // Baixa física: movimento ANTES da atualização do saldo (razão → saldo)
      const custoUnit = (() => {
        const b = DB.stockBalances.find(b => b.productId === pkItem.componentProductId && b.warehouseId === pkItem.warehouseId);
        return b ? b.custoMedio : 0;
      })();
      DB.stockMovements.push({
        id: uid('mov'),
        productId: pkItem.componentProductId,
        warehouseId: pkItem.warehouseId,
        tipo: 'saida_producao',
        quantidade: item.quantidadeSeparada,
        sinal: -1,
        custoUnitario: custoUnit,
        origemTipo: 'ordem_producao',
        origemId: op ? op.id : os.id,
        criadoEm: new Date().toISOString()
      });
      // Atualiza saldo APÓS registrar movimento
      const bal = DB.stockBalances.find(b => b.productId === pkItem.componentProductId && b.warehouseId === pkItem.warehouseId);
      if(bal){ bal.quantidade = Math.max(0, bal.quantidade - item.quantidadeSeparada); }

      // Consome reserva — A-01: usa STATUS
      const res = DB.stockReservations.find(r => r.origemId === (op ? op.id : os.id) && r.productId === pkItem.componentProductId && r.status === 'ativa');
      if(res){ res.status = 'consumida'; }

      produtosAfetados.add(pkItem.componentProductId);
    }

    // A-01: usa STATUS enum
    os.status = STATUS.OS.CONCLUIDA;
    if(op){
      const todosSeparados = DB.productionOrderMaterials.filter(m => m.productionOrderId === op.id).every(m => m.quantidadeConsumida >= m.quantidadeNecessaria);
      if(todosSeparados) op.status = STATUS.OP.LIBERADA;
    }
    log('picking_order', osId, `OS ${os.numero} confirmada e estoque baixado.`);
  });

  // M-04: avaliar estoque fora do loop, uma vez por produto único
  produtosAfetados.forEach(pid => avaliarEstoqueMinimo(pid, { origemTipo: 'saida_producao', origemId: os.id }));
  save();
  return os;
}


function concluirOrdemProducao(opId, qtdProduzida, qtdRefugo, usuarioId=null){
  const op = DB.productionOrders.find(o => o.id === opId);
  if(!op) throw new Error('OP não encontrada.');

  transact(() => {
    op.quantidadeProduzida = qtdProduzida;
    op.quantidadeRefugo = qtdRefugo;
    op.status = STATUS.OP.CONCLUIDA; // A-01: usa enum

    // Entrada de produto acabado: movimento PRIMEIRO (razão → saldo)
    const depPA = DB.warehouses.find(w => w.ativo && w.tipo === 'produto_acabado') || DB.warehouses[0];
    DB.stockMovements.push({
      id: uid('mov'),
      productId: op.productId,
      warehouseId: depPA.id,
      tipo: 'entrada_producao',
      quantidade: qtdProduzida,
      sinal: 1,
      custoUnitario: 0,
      origemTipo: 'ordem_producao',
      origemId: op.id,
      criadoEm: new Date().toISOString()
    });
    // Atualiza saldo APÓS registrar movimento
    let balPA = DB.stockBalances.find(b => b.productId === op.productId && b.warehouseId === depPA.id);
    if(!balPA){
      balPA = { id: uid('bal'), productId: op.productId, warehouseId: depPA.id, locationId: null, quantidade: 0, custoMedio: 0 };
      DB.stockBalances.push(balPA);
    }
    balPA.quantidade += qtdProduzida;

    // A-01: usa STATUS enum
    if(op.salesOrderId){
      const pv = DB.salesOrders.find(s => s.id === op.salesOrderId);
      if(pv){
        pv.status = STATUS.PV.PRONTO_EXPEDICAO;
        log('sales_order', pv.id, `Pedido de Venda ${pv.numero} atualizado para PRONTO P/ EXPEDIÇÃO após conclusão da ${op.numero}.`);
      }
    }
    log('production_order', op.id, `OP ${op.numero} concluída. Produzido: ${formatMilliQty(qtdProduzida)}, Refugo: ${formatMilliQty(qtdRefugo)}.`);
  });

  avaliarEstoqueMinimo(op.productId, { origemTipo: 'entrada_producao', origemId: op.id });
  save();

  return op;
}

// 4. Vendas
function confirmarPedidoVenda(pvId, params={}){
  const pv = DB.salesOrders.find(s => s.id === pvId);
  if(!pv) throw new Error('Pedido de Venda não encontrado.');

  const itens = DB.salesOrderItems.filter(i => i.salesOrderId === pvId);
  const opsCriadas = [];

  for(const it of itens){
    let bom = null;
    if(it.bomVersionId) bom = DB.bomVersions.find(b => b.id === it.bomVersionId);
    else bom = DB.bomVersions.find(b => b.productId === it.productId && b.status === 'ativa');

    const op = criarOrdemProducao({
      salesOrderId: pv.id,
      salesOrderItemId: it.id,
      productId: it.productId,
      modeloMaquina: it.modeloMaquina || (bom ? bom.descricao : 'Personalizado'),
      bomVersionId: bom ? bom.id : null,
      quantidade: it.quantidade,
      prioridade: 'normal',
      dataPrevistaInicio: today(),
      dataPrevistaFim: pv.dataEntregaPrometida || today()
    });
    opsCriadas.push(op);
  }

  pv.status = STATUS.PV.EM_PRODUCAO; // A-01: usa enum
  log('sales_order', pv.id, `Pedido de Venda ${pv.numero} confirmado. Gerada(s) ${opsCriadas.length} OP(s).`);
  return { pv, opsCriadas };
}

// 5. Recebimento de Compras & Atendimento Automático
function receberPedidoCompra(orderId, itensRecebidos, usuarioId=null){
  const order = DB.orders.find(o => o.id === orderId);
  if(!order) throw new Error('Pedido de Compra não encontrado.');

  const depMateriaPrima = DB.warehouses.find(w => w.ativo && w.tipo === 'materia_prima') || DB.warehouses[0];

  // M-04 FIX: coletar productIds únicos para avaliar estoque fora do loop
  const produtosAfetados = new Set();

  // B-01 FIX: toda a mutação em transact
  transact(() => {
    for(const it of itensRecebidos){
      const precoUnit = Math.round(it.precoUnitario || 0); // garantir inteiro
      let bal = DB.stockBalances.find(b => b.productId === it.productId && b.warehouseId === depMateriaPrima.id);

      // A-02 FIX: registrar movimento PRIMEIRO (razão → saldo), depois atualizar saldo e custo médio
      DB.stockMovements.push({
        id: uid('mov'),
        productId: it.productId,
        warehouseId: depMateriaPrima.id,
        tipo: 'entrada_compra',
        quantidade: it.quantidadeRecebida,
        sinal: 1,
        custoUnitario: precoUnit,
        origemTipo: 'pedido_compra',
        origemId: order.id,
        criadoEm: new Date().toISOString()
      });

      if(!bal){
        bal = { id: uid('bal'), productId: it.productId, warehouseId: depMateriaPrima.id, locationId: null, quantidade: 0, custoMedio: precoUnit };
        DB.stockBalances.push(bal);
      }
      // A-02 FIX: Custo médio ponderado — (saldoAnt × custoAnt + qtdReceb × precoUnit) / novoTotal
      const saldoAnt = bal.quantidade;
      const custoAnt = bal.custoMedio;
      bal.quantidade += it.quantidadeRecebida;
      if(bal.quantidade > 0){
        bal.custoMedio = Math.round((saldoAnt * custoAnt + it.quantidadeRecebida * precoUnit) / bal.quantidade);
      }

      // Atendimento automático de faltas em OPs prioritárias
      const opsFaltando = DB.productionOrderMaterials.filter(m => m.componentProductId === it.productId && m.faltaQuantidade > 0);
      let saldoDisponivelAlocar = it.quantidadeRecebida;

      for(const opMat of opsFaltando){
        if(saldoDisponivelAlocar <= 0) break;
        const qtdAlocar = Math.min(saldoDisponivelAlocar, opMat.faltaQuantidade);
        opMat.faltaQuantidade -= qtdAlocar;
        opMat.quantidadeReservada += qtdAlocar;
        saldoDisponivelAlocar -= qtdAlocar;

        DB.stockReservations.push({
          id: uid('res'),
          productId: it.productId,
          warehouseId: depMateriaPrima.id,
          quantidade: qtdAlocar,
          origemTipo: 'ordem_producao',
          origemId: opMat.productionOrderId,
          status: 'ativa',
          criadoEm: new Date().toISOString()
        });

        const faltasRestantes = DB.productionOrderMaterials.filter(m => m.productionOrderId === opMat.productionOrderId).reduce((acc, m) => acc + m.faltaQuantidade, 0);
        if(faltasRestantes === 0){
          const op = DB.productionOrders.find(o => o.id === opMat.productionOrderId);
          if(op && op.status === STATUS.OP.AGUARDANDO_MATERIAL){ // A-01: usa enum
            op.status = STATUS.OP.MATERIAL_RESERVADO;
            log('production_order', op.id, `Faltas atendidas pela entrada do Pedido ${order.numero}. Status: MATERIAL RESERVADO.`);
          }
        }
      }

      produtosAfetados.add(it.productId);
    }

    order.status = STATUS.ORD.RECEBIDO; // A-01: usa enum
    log('order', order.id, `Pedido de Compra ${order.numero} recebido no estoque.`);
  });

  // M-04: avaliar estoque fora do loop, uma vez por produto único
  produtosAfetados.forEach(pid => avaliarEstoqueMinimo(pid, { origemTipo: 'entrada_compra', origemId: order.id }));
  save();
  return order;
}

function solicitarPecaTicket(ticketId, productId, quantidadeMilli, cobrar=false){
  const tk = DB.tickets.find(t => t.id === ticketId);
  if(!tk) throw new Error('Ticket não encontrado.');
  const prod = DB.products.find(p => p.id === productId);

  const saldo = DB.stockBalances.filter(b => b.productId === productId && b.warehouseId === 'wh-1').reduce((a,b)=>a+b.quantidade,0);
  const res = DB.stockReservations.filter(r => r.productId === productId && r.status === 'ativa').reduce((a,r)=>a+r.quantidade,0);
  const disp = Math.max(0, saldo - res);

  if(disp >= quantidadeMilli){
    DB.stockReservations.push({
      id: uid('res'),
      productId,
      warehouseId: 'wh-1',
      quantidade: quantidadeMilli,
      origemTipo: 'ticket',
      origemId: ticketId,
      status: 'ativa',
      criadoEm: new Date().toISOString()
    });
    DB.ticketParts.push({
      id: uid('tkp'),
      ticketId,
      productId,
      quantidade: quantidadeMilli,
      origem: 'estoque',
      status: 'reservada',
      cobrar
    });
    tk.status = 'em_atendimento';
  } else {
    const reqId = uid('req');
    const reqNum = seq(DB.requisitions, 'seqReqPrefix', 'REQ-');
    DB.requisitions.push({
      id: reqId,
      numero: reqNum,
      solicitanteId: (DB.currentUser && DB.currentUser.id) || 'usr-suporte',
      solicitanteNome: 'Suporte Técnico JP3D',
      setor: 'Suporte',
      prioridade: 'urgente',
      status: 'aprovada',
      observacoes: `Peça em falta para o chamado de suporte ${tk.numero}`,
      criadoEm: today()
    });
    DB.requisitionItems.push({
      id: uid('reqit'),
      requisitionId: reqId,
      productId,
      descricao: prod ? prod.descricao : 'Peça de Reposição',
      unidade: prod ? prod.unidade : 'UN',
      quantidade: quantidadeMilli - disp,
      precoEstimado: prod ? prod.precoReferencia : 0
    });
    DB.ticketParts.push({
      id: uid('tkp'),
      ticketId,
      productId,
      quantidade: quantidadeMilli,
      origem: 'compra',
      status: 'solicitada',
      cobrar
    });
    tk.status = 'aguardando_peca';
  }
  avaliarEstoqueMinimo(productId, { origemTipo: 'ticket', origemId: ticketId });
  log('ticket', ticketId, `Peça ${prod ? prod.descricao : productId} solicitada (${formatMilliQty(quantidadeMilli)}).`);
}

function gerarOPRetrabalhoTicket(ticketId, bomVersionId, quantidadeMilli){
  const tk = DB.tickets.find(t => t.id === ticketId);
  if(!tk) throw new Error('Ticket não encontrado.');

  const op = criarOrdemProducao({
    salesOrderId: tk.salesOrderId,
    productId: tk.productId,
    modeloMaquina: `Retrabalho: ${tk.numeroSerie}`,
    bomVersionId,
    quantidade: quantidadeMilli,
    prioridade: 'urgente',
    dataPrevistaInicio: today(),
    dataPrevistaFim: today()
  });
  op.tipo = 'retrabalho';
  tk.status = 'em_atendimento';
  log('ticket', ticketId, `OP de Retrabalho ${op.numero} vinculada ao chamado.`);
  return op;
}

function dialog({title,body,footer,width='max-w-xl',onOpen}){
  const d = document.createElement('div');
  d.className='fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-950/70 p-4 sm:p-8 no-print';
  d.innerHTML = `<div class="fade w-full ${width} rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-2xl overflow-hidden my-auto">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-5 py-3.5 bg-slate-50/50 dark:bg-slate-900/50">
        <h2 class="font-bold text-[15px] text-slate-900 dark:text-white">${esc(title)}</h2>
        <button class="rounded-lg p-1 text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200 transition-colors" data-close data-testid="button-fechar-dialog">${icon('x')}</button></div>
      <div class="px-5 py-4 max-h-[78vh] overflow-y-auto" data-body>${body}</div>
      <div class="flex justify-end gap-2 border-t border-slate-200 dark:border-slate-800 px-5 py-3.5 bg-slate-50/30 dark:bg-slate-900/30" data-footer>${footer||''}</div></div>`;
  d.addEventListener('mousedown', e=>{ if(e.target===d) close(); });
  d.querySelector('[data-close]').onclick = close;
  function close(){ d.remove(); }
  d.close = close;
  document.getElementById('dialogs').appendChild(d);
  if(onOpen) onOpen(d);
  const f = d.querySelector('input,select,textarea'); if(f) f.focus();
  return d;
}
function confirmDialog(title,desc,onYes,{danger=true,label='Confirmar',extra=''}={}){
  const d = dialog({title, width:'max-w-md',
    body:`<p class="text-slate-600 dark:text-slate-300 text-[13px]">${esc(desc)}</p>${extra}`,
    footer:`${btn('Cancelar',{variant:'ghost',testid:'button-cancelar'})}${btn(label,{variant:danger?'danger':'primary',testid:'button-confirmar'})}`});
  const [c,ok] = d.querySelectorAll('[data-footer] button');
  c.onclick = () => d.close();
  ok.onclick = () => { const v = onYes(d); if(v!==false) d.close(); };
  return d;
}
function toast(msg,type='info'){
  const t = document.createElement('div');
  const border = type==='error'?'border-red-500 bg-red-950/80 text-red-200':type==='success'?'border-emerald-500 bg-emerald-950/80 text-emerald-200':'border-brand-500 bg-slate-900/90 text-slate-100';
  t.className = `fade flex items-center gap-2 rounded-xl border px-3.5 py-2.5 text-xs shadow-xl backdrop-blur ${border}`;
  t.innerHTML = `<span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

function getAReceberInfo(productId) {
  const ocsAtivas = (DB.orders || []).filter(oc =>
    ['emitido', 'confirmado_fornecedor', 'recebido_parcial'].includes(oc.status)

}

function initResizableCols(tableId) {
  const table = document.getElementById(tableId);
  if (!table) return;
  const storageKey = `jp3d_col_widths_${tableId}`;
  const ths = table.querySelectorAll('thead th');
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch(e){}

  ths.forEach((th, i) => {
    if (saved[i]) th.style.width = saved[i] + 'px';
    if (th.classList.contains('col-acoes') || th.dataset.noresize === 'true') return;

    if (!th.querySelector('.col-resizer')) {
      const resizer = document.createElement('div');
      resizer.className = 'col-resizer';
      th.style.position = 'relative';
      th.appendChild(resizer);

      let startX, startW;
      resizer.addEventListener('mousedown', e => {
        startX = e.clientX;
        startW = th.offsetWidth;
        const onMouseMove = (eMove) => {
          const newW = Math.max(60, startW + (eMove.clientX - startX));
          th.style.width = newW + 'px';
        };
        const onMouseUp = () => {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          const widths = {};
          ths.forEach((t, idx) => { widths[idx] = t.offsetWidth; });
          try { localStorage.setItem(storageKey, JSON.stringify(widths)); } catch(e){}
        };
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        e.preventDefault();
        e.stopPropagation();
      });
    }
  });
}

function resetResizableCols(tableId) {
  const storageKey = `jp3d_col_widths_${tableId}`;
  localStorage.removeItem(storageKey);
  const table = document.getElementById(tableId);
  if (table) {
    table.querySelectorAll('thead th').forEach(th => { th.style.width = ''; });
  }
  toast('Larguras das colunas restauradas!', 'info');
}

function sortTableColumn(tableId, colIdx) {
  const cur = TABLE_SORTS[tableId] || { colIdx: -1, dir: 'asc' };
  if (cur.colIdx === colIdx) {
    cur.dir = cur.dir === 'asc' ? 'desc' : 'asc';
  } else {
    cur.colIdx = colIdx;
    cur.dir = 'asc';
  }
  TABLE_SORTS[tableId] = cur;
  render();
}

function table(cols, rows, {tableId='', testid='table', onRow=null, sortable=true}={}){
  if(!rows.length) return '';
  const id = tableId || ('tbl_' + Math.random().toString(36).slice(2, 8));

  let sortedRows = [...rows];
  const sortState = TABLE_SORTS[id];
  if(sortState && sortState.colIdx >= 0 && sortState.colIdx < cols.length) {
    const col = cols[sortState.colIdx];
    const isDesc = sortState.dir === 'desc';
    sortedRows.sort((a, b) => {
      let va = col.sortVal ? col.sortVal(a) : (col.render ? col.render(a) : '');
      let vb = col.sortVal ? col.sortVal(b) : (col.render ? col.render(b) : '');
      if (typeof va === 'string') va = va.replace(/<[^>]*>/g, '').trim().toLowerCase();
      if (typeof vb === 'string') vb = vb.replace(/<[^>]*>/g, '').trim().toLowerCase();
      if (va < vb) return isDesc ? 1 : -1;
      if (va > vb) return isDesc ? -1 : 1;
      return 0;
    });
  }

  setTimeout(() => initResizableCols(id), 60);

  return `
    <div class="relative">
      <div class="flex justify-end mb-1">
        <button type="button" onclick="App.resetResizableCols('${id}')" title="Restaurar largura padrão das colunas" class="inline-flex items-center gap-1 text-[11px] text-slate-400 hover:text-brand-600 transition-colors py-0.5 px-1.5 rounded">
          ${icon('gear', 'w-3 h-3')} Restaurar Colunas
        </button>
      </div>
      <div class="overflow-x-auto">
        <table id="${id}" class="w-full min-w-[640px]" data-testid="${testid}">
          <thead class="bg-slate-50 dark:bg-slate-950/40 select-none">
            <tr>
              ${cols.map((c, i) => {
                const isSortCol = sortState && sortState.colIdx === i;
                const sortIcon = isSortCol ? (sortState.dir === 'asc' ? ' ↑' : ' ↓') : '';
                const isActionCol = c.label === 'Ações' || (c.cls && c.cls.includes('col-acoes'));
                return `<th class="${TH} ${c.cls||''} ${isActionCol?'col-acoes':''} ${sortable&&!isActionCol?'cursor-pointer hover:bg-slate-200/50 dark:hover:bg-slate-800':''}"
                  ${sortable&&!isActionCol?`onclick="sortTableColumn('${id}', ${i})"`:''}
                  ${isActionCol?'data-noresize="true"':''}>
                  <span>${esc(c.label)}${sortIcon}</span>
                </th>`;
              }).join('')}
            </tr>
          </thead>
          <tbody>
            ${sortedRows.map(r => `<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 ${onRow?'cursor-pointer':''} transition-colors" ${onRow?`onclick="${onRow(r)}"`:''} data-testid="row-${esc(r.id||'')}">
              ${cols.map(c => `<td class="${TD} ${c.cls||''}">${c.render(r)}</td>`).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function searchInput(ph){ return `<div class="relative min-w-[200px] flex-1 max-w-xs"><span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400">${icon('search','w-3.5 h-3.5')}</span>

      ops.filter(o=>o.status==='material_reservado'||o.status==='liberada').length || 2,

    const lineLeadLabels = ['Linha CV (Letra Caixa)', 'Linha CX (Volumétricas)'];
    const lineLeadData = [58, 66];

    return {

        { label: 'Prazo Médio de Produção', val: `62 dias`, trend: '✓ Meta de 65 dias atingida', trendColor: 'text-emerald-500' },

  // financeiro
  const pvs = DB.salesOrders || [];
  let recMes = 0;

  const custosMes = Math.round(recMes * 0.42);

    ],
    chart1: {
      type: 'bar',
      labels: finMonths,
      datasets: [

        { label: 'Custos (R$)', data: costData, backgroundColor: '#eb6834' }
      ],
      isCurrency: true
    },
    chart2: {
      type: 'bar',
      labels: contractLabels,
      datasets: [{ label: 'Valores em R$', data: contractData, backgroundColor: ['#1baf7a', '#2a78d6'] }],

}

function renderChartLegendaHTML(containerId, chartConfig) {
  const container = document.getElementById(containerId);
  if(!container || !chartConfig) return;

  const datasets = chartConfig.datasets || [];
  let html = '<div class="flex flex-wrap items-center justify-center gap-4 mt-3 text-xs">';
  
  if (chartConfig.type === 'doughnut') {
    const labels = chartConfig.labels || [];
    const colors = datasets[0].backgroundColor || [];
    const data = datasets[0].data || [];
    labels.forEach((lbl, idx) => {
      const color = Array.isArray(colors) ? colors[idx % colors.length] : colors;
      const val = data[idx];
      const valStr = chartConfig.isCurrency ? `R$ ${val.toLocaleString('pt-BR')}` : (chartConfig.isPercent ? `${val}%` : `${val}`);
      html += `
        <div class="flex items-center gap-1.5 font-medium text-slate-700 dark:text-slate-300">
          <span class="inline-block w-3 h-3 rounded-xs shrink-0" style="background-color: ${color}"></span>
          <span>${esc(lbl)}: <b class="num">${valStr}</b></span>
        </div>`;
    });
  } else {
    datasets.forEach(ds => {
      const color = ds.backgroundColor;
      html += `
        <div class="flex items-center gap-1.5 font-medium text-slate-700 dark:text-slate-300">
          <span class="inline-block w-3 h-3 rounded-xs shrink-0" style="background-color: ${color}"></span>
          <span>${esc(ds.label)}</span>
        </div>`;
    });
  }
  html += '</div>';
  container.innerHTML = html;
}

function initDashboardSectorCharts(setor, data) {
  if (typeof Chart === 'undefined') return;

  window._dashCharts = window._dashCharts || {};

  // Chart 1
  const ctx1 = document.getElementById('dashChart1')?.getContext('2d');
  if (ctx1) {
    if (window._dashCharts['chart1']) window._dashCharts['chart1'].destroy();
    window._dashCharts['chart1'] = new Chart(ctx1, {
      type: data.chart1.type,
      data: {
        labels: data.chart1.labels,
        datasets: data.chart1.datasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: data.chart1.indexAxis || 'x',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                const val = ctx.parsed.y !== undefined && ctx.parsed.y !== null ? ctx.parsed.y : ctx.parsed.x;
                if (data.chart1.isCurrency) return ` R$ ${val.toLocaleString('pt-BR')}`;
                return ` ${val.toLocaleString('pt-BR')}`;
              }
            }
          }
        },
        scales: data.chart1.type === 'doughnut' ? {} : {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { grid: { color: '#94a3b822' }, ticks: { font: { size: 11 } } }
        }
      }
    });
    renderChartLegendaHTML('dashChart1Legenda', data.chart1);
  }

  // Chart 2
  const ctx2 = document.getElementById('dashChart2')?.getContext('2d');
  if (ctx2) {
    if (window._dashCharts['chart2']) window._dashCharts['chart2'].destroy();
    window._dashCharts['chart2'] = new Chart(ctx2, {
      type: data.chart2.type,
      data: {
        labels: data.chart2.labels,
        datasets: data.chart2.datasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: data.chart2.indexAxis || 'x',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                const val = ctx.parsed.y !== undefined && ctx.parsed.y !== null ? ctx.parsed.y : ctx.parsed.x;
                if (data.chart2.isCurrency) return ` R$ ${val.toLocaleString('pt-BR')}`;
                if (data.chart2.isPercent) return ` ${val}%`;
                return ` ${val.toLocaleString('pt-BR')}`;
              }
            }
          }
        },
        scales: data.chart2.type === 'doughnut' ? {} : {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { grid: { color: '#94a3b822' }, ticks: { font: { size: 11 } } }
        }
      }
    });
    renderChartLegendaHTML('dashChart2Legenda', data.chart2);
  }
}

function getEtapasProducao(op) {
  let rops = (DB.routingOperations || []).filter(r =>
    r.bomVersionId === op.bomVersionId ||
    r.productId === op.productId
  );

  if (!rops.length && op.bomVersionId) {
    const bom = (DB.bomVersions || []).find(b => b.id === op.bomVersionId);
    if (bom) {
      rops = (DB.routingOperations || []).filter(r => r.bomVersionId === bom.id || r.productId === bom.productId);
    }
  }

  if (rops.length > 0) {
    return [...rops].sort((a, b) => (a.sequencia || 0) - (b.sequencia || 0)).map((r, i) => ({
      idx: i,
      sequencia: r.sequencia || ((i + 1) * 10),
      nome: r.nome || `Etapa ${i + 1}`,
      instrucoes: r.instrucoes || '',
      workCenterId: r.workCenterId || null,
      tempoMin: r.tempoUnitarioMin || 0
    }));
  }

  return [
    { idx: 0, sequencia: 10, nome: 'Montagem Estrutural & Guias Lineares', instrucoes: 'Montar frame de aço CNC, fixar guias HHW/MGN12 e verificar esquadro com relógio comparador.', tempoMin: 300 },
    { idx: 1, sequencia: 20, nome: 'Instalação Eletrônica Klipper & Chicote', instrucoes: 'Instalar MCU Klipper Linux 64bit, conectar acelerômetros ADXL345, testar continuidade dos chicotes e conectores aeronáuticos.', tempoMin: 240 },
    { idx: 2, sequencia: 30, nome: 'Extrusão Direct Drive & Mesa Aquecida', instrucoes: 'Montar conjunto extrusor Direct Drive 100% metálico, hotend Titânio 300°C e mesa aquecida 120°C com vidro temperado.', tempoMin: 180 },
    { idx: 3, sequencia: 40, nome: 'Calibração Quad Gantry & Input Shaping', instrucoes: 'Executar alinhamento automático Quad Gantry Level nos 4 eixos Z, gerar malha de mesa e calibrar Input Shaping via acelerômetro.', tempoMin: 120 },
    { idx: 4, sequencia: 50, nome: 'Testes de Qualidade & Burn-in 12h', instrucoes: 'Executar rotina contínua de impressão 12h em alta velocidade (150mm/s+) e inspecionar estanqueidade e repetibilidade.', tempoMin: 720 },
    { idx: 5, sequencia: 60, nome: 'Inspeção Final & Embalagem Industrial', instrucoes: 'Inspeção de acabamento, emissão de laudo técnico de qualidade e embalagem em estrutura de madeira para transporte.', tempoMin: 90 }
  ];
}

function viewProducts(){
  const selectedCnpj = UI.selectedStockCnpjId || DB.currentCompanyId || 'comp-1';

  return pageTitle('Catálogo de Produtos & Insumos', 'Itens com estoque mínimo, lote de reposição e saldos isolados por CNPJ')
    + renderCnpjFilterHeaderHTML()
    + card(table([
      {label:'Código', render:p=>`<span class="num font-bold text-slate-500">${esc(p.codigo)}</span>`},
      {label:'Descrição', render:p=>`<div><span class="font-bold block">${esc(p.descricao)}</span><span class="text-[10px] font-mono text-slate-400">Tipo: ${esc(p.tipo || 'MP')}</span></div>`},
      {label:'Unidade', render:p=>esc(p.unidade)},
      {label:'Saldo Físico (CNPJ)', cls:'text-right', render:p => {
        const depValidos = DB.warehouses.filter(w => w.ativo && (selectedCnpj === 'todas' || (w.companyId || 'comp-1') === selectedCnpj)).map(w => w.id);
        const saldo = DB.stockBalances.filter(b => b.productId === p.id && depValidos.includes(b.warehouseId) && (selectedCnpj === 'todas' || (b.companyId || 'comp-1') === selectedCnpj)).reduce((a,b)=>a+b.quantidade,0);
        return `<span class="num font-extrabold text-slate-900 dark:text-white">${formatMilliQty(saldo, p.unidade)}</span>`;
      }},
      {label:'Custo Médio (CNPJ)', cls:'text-right', render:p => {
        const balObj = DB.stockBalances.find(b => b.productId === p.id && (selectedCnpj === 'todas' || (b.companyId || 'comp-1') === selectedCnpj));
        const cm = (balObj && balObj.custoMedio) || p.custoMedioCents || p.precoReferencia || 0;
        return `<span class="num font-mono text-emerald-600 font-bold">${centsToBRL(cm)}</span>`;
      }},
      {label:'Estoque Mínimo', cls:'text-right', render:p=>`<span class="num font-semibold text-red-500">${formatMilliQty(p.estoqueMinimo, p.unidade)}</span>`},
      {label:'Ações', cls:'text-right', render:p=>renderBotoesAcao('product', p.id, p.descricao)}
    ], DB.products||[]));
}

function renderEditorEtapasProducaoBOM() {
  const user = getCurrentUser();
  const role = getUserRole(user);
  const isSuperAdmin = user && (user.roleId === 'role-admin' || role?.id === 'role-admin');

  if (!isSuperAdmin) return '';

  const boms = DB.bomVersions || [];
  const selectedBomId = UI.selectedConfigBomId || (boms[0]?.id || 'bom-cv1200');
  const bom = boms.find(b => b.id === selectedBomId) || boms[0];
  const prod = bom ? (DB.products || []).find(p => p.id === bom.productId) : null;

  let rops = (DB.routingOperations || []).filter(r => r.bomVersionId === selectedBomId || (prod && r.productId === prod.id));

  if (!rops.length && bom) {
    const defaultSteps = [
      { sequencia: 10, nome: 'Montagem Estrutural & Guias Lineares', instrucoes: 'Montar frame de aço CNC, fixar guias HHW/MGN12 e verificar esquadro com relógio comparador.', tempoUnitarioMin: 300 },
      { sequencia: 20, nome: 'Instalação Eletrônica Klipper & Chicote', instrucoes: 'Instalar MCU Klipper Linux 64bit, conectar acelerômetros ADXL345, testar continuidade dos chicotes.', tempoUnitarioMin: 240 },
      { sequencia: 30, nome: 'Extrusão Direct Drive & Mesa Aquecida', instrucoes: 'Montar conjunto extrusor Direct Drive 100% metálico, hotend Titânio 300°C e mesa aquecida 120°C com vidro temperado.', tempoUnitarioMin: 180 },
      { sequencia: 40, nome: 'Calibração Quad Gantry & Input Shaping', instrucoes: 'Executar alinhamento automático Quad Gantry Level nos 4 eixos Z, gerar malha de mesa e calibrar Input Shaping.', tempoUnitarioMin: 120 },
      { sequencia: 50, nome: 'Testes de Qualidade & Burn-in 12h', instrucoes: 'Executar rotina contínua de impressão 12h em alta velocidade (150mm/s+) e inspecionar estanqueidade.', tempoUnitarioMin: 720 },
      { sequencia: 60, nome: 'Inspeção Final & Embalagem Industrial', instrucoes: 'Inspeção de acabamento, emissão de laudo técnico de qualidade e embalagem em caixa compensada.', tempoUnitarioMin: 90 }
    ];

    defaultSteps.forEach(ds => {
      DB.routingOperations.push({
        id: uid('rop'),
        bomVersionId: bom.id,
        productId: bom.productId,
        sequencia: ds.sequencia,
        nome: ds.nome,
        instrucoes: ds.instrucoes,
        tempoUnitarioMin: ds.tempoUnitarioMin,
        workCenterId: 'wc-1'
      });
    });
    save();
    rops = (DB.routingOperations || []).filter(r => r.bomVersionId === bom.id || (prod && r.productId === prod.id));
  }

  rops.sort((a, b) => (a.sequencia || 0) - (b.sequencia || 0));

  return card(`
    <div class="p-6 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800 pb-4">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-brand-700 text-white">RESTRITO • SUPER ADMIN</span>
            <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-1.5">
              ${icon('wrench', 'w-4 h-4 text-brand-600')} Gerenciador de Etapas de Produção por Modelo
            </h3>
          </div>
          <p class="text-xs text-slate-500 mt-1">
            Altere as etapas de produção inline, reordene e adicione/remova passos. Qualquer alteração atualizará em tempo real o Stepper Touch do Chão de Fábrica.
          </p>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-xs font-bold text-slate-500">Modelo da Máquina:</label>
          <select onchange="UI.selectedConfigBomId = this.value; App.render();" class="${INP} !w-auto font-bold text-xs">
            ${boms.map(b => {
              const p = (DB.products || []).find(x => x.id === b.productId);
              return `<option value="${b.id}" ${b.id === selectedBomId ? 'selected' : ''}>
                [${esc(p?.linha || '3D')}] ${esc(p?.descricao || b.descricao)} (${esc(b.versao)})
              </option>`;
            }).join('')}
          </select>
          ${btn('+ Nova Etapa', { action: `App.adicionarEtapaProducaoBOM('${selectedBomId}')`, variant: 'primary', icon: 'plus', cls: '!text-xs' })}
        </div>
      </div>

      <div class="space-y-3">
        ${rops.map((r, idx) => `
          <div class="p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/40 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2 flex-1 min-w-[280px]">
                <span class="num text-xs font-mono font-bold px-2 py-1 rounded bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200">
                  SEQ ${r.sequencia || (idx + 1) * 10}
                </span>
                <input type="text" value="${esc(r.nome)}"
                  onchange="App.atualizarEtapaProducaoBOM('${r.id}', 'nome', this.value)"
                  class="${INP} font-bold text-xs !py-1" placeholder="Nome da Etapa de Produção" />
              </div>
              <div class="flex items-center gap-1">
                <button type="button" onclick="App.reordenarEtapaProducaoBOM('${r.id}', 'up')" ${idx === 0 ? 'disabled' : ''}
                  class="px-2 py-1 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 disabled:opacity-30 text-xs font-bold" title="Mover para cima">
                  ▲ Mover Cima
                </button>
                <button type="button" onclick="App.reordenarEtapaProducaoBOM('${r.id}', 'down')" ${idx === rops.length - 1 ? 'disabled' : ''}
                  class="px-2 py-1 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 disabled:opacity-30 text-xs font-bold" title="Mover para baixo">
                  ▼ Mover Baixo
                </button>
                <button type="button" onclick="App.removerEtapaProducaoBOM('${r.id}')"
                  class="px-2 py-1 rounded bg-red-100 dark:bg-red-950 text-red-700 dark:text-red-300 hover:bg-red-200 text-xs font-bold ml-2" title="Excluir esta etapa">
                  ${icon('trash', 'w-3.5 h-3.5')}
                </button>
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Instrução Técnica / Descrição do Passo:</label>
              <textarea onchange="App.atualizarEtapaProducaoBOM('${r.id}', 'instrucoes', this.value)"
                class="${INP} text-xs font-mono !py-1.5" rows="2" placeholder="Instruções para o operador no chão de fábrica...">${esc(r.instrucoes || '')}</textarea>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `);
}

function renderPermissionTreeHTML(userPerms = [], isSuperAdmin = false) {
  return `
    <div id="treeContainer" class="${isSuperAdmin ? 'opacity-40 pointer-events-none' : ''} space-y-4 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 bg-slate-50/60 dark:bg-slate-900/60">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-2.5">
        <span class="text-xs font-extrabold uppercase tracking-wider text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
          🌳 Árvore de Permissões por Módulo & Aba do Sistema
        </span>
        <div class="flex items-center gap-3">
          <button type="button" onclick="App.toggleAllTreeCheckboxes(true)" class="text-[11px] font-bold text-brand-600 dark:text-brand-400 hover:underline">✓ Marcar Todos</button>
          <button type="button" onclick="App.toggleAllTreeCheckboxes(false)" class="text-[11px] font-bold text-slate-500 hover:underline">✕ Desmarcar Todos</button>
        </div>
      </div>

      ${NAV_GROUPS.map((g, gIdx) => {
        const groupPaths = g.items.map(i => i.p);
        const allGroupChecked = groupPaths.every(p => userPerms.includes(p));

        return `
          <div class="space-y-2 border-b border-slate-200 dark:border-slate-800/60 pb-3 last:border-0 last:pb-0">
            <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800/80 p-2 rounded-xl">
              <input type="checkbox" id="mod_${gIdx}"
                onchange="App.toggleModuloTreeCheckboxes(${gIdx}, this.checked)"
                ${allGroupChecked ? 'checked' : ''}
                class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 cursor-pointer" />
              <label for="mod_${gIdx}" class="text-xs font-extrabold uppercase text-slate-900 dark:text-white cursor-pointer flex-1 select-none">
                📁 Módulo: ${esc(g.titulo)} (${g.items.length} abas)
              </label>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pl-4 sm:pl-6 pt-1">
              ${g.items.map((it) => {
                const label = (DB.customNavLabels && DB.customNavLabels[it.p]) || it.label;
                const isChecked = userPerms.includes(it.p) || isSuperAdmin;

                return `
                  <label class="flex items-center gap-2 text-xs text-slate-700 dark:text-slate-300 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/40 p-1.5 rounded-lg transition-colors">
                    <input type="checkbox" name="usrPermPath" value="${esc(it.p)}" data-group="${gIdx}"
                      ${isChecked ? 'checked' : ''}
                      class="w-3.5 h-3.5 rounded text-brand-600 focus:ring-brand-500 cursor-pointer item-perm-chk" />
                    <span class="font-bold text-slate-900 dark:text-slate-100">${esc(label)}</span>
                    <span class="text-[10px] text-slate-400 font-mono">(${esc(it.p)})</span>
                  </label>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

  NAV_GROUPS.forEach(g => {

          </p>
        </div>

  salvarNovoLead(){
    const nome = document.getElementById('ldNome').value.trim();
    const cnpjCpf = document.getElementById('ldCnpj').value.trim();
    const email = document.getElementById('ldEmail').value.trim();
    const telefone = document.getElementById('ldTel').value.trim();
    const modeloId = document.getElementById('ldModelo').value;
    const valCents = Math.round((parseFloat(document.getElementById('ldValor').value) || 0) * 100);

    if (!nome) { toast('Informe o nome ou razão social do lead.', 'error'); return; }

    if (!DB.crmLeads) DB.crmLeads = [];

      id: uid('lead'),
      clienteId: null,
      nome,
      cnpjCpf,
      email,
      telefone,
      modeloId,
      valorEstimado: valCents,

    });

    commit();
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());

    render();
  },

  gerarCotacaoDoLead(leadId){
    const lead = (DB.crmLeads || []).find(l => l.id === leadId);
    if (!lead) return;

    let cust = (DB.customers || []).find(c => c.id === lead.clienteId || c.cnpj === lead.cnpjCpf);
    if (!cust) {
      cust = {
        id: uid('cust'),
        nome: lead.nome,
        cnpj: lead.cnpjCpf || '00.000.000/0001-00',
        email: lead.email,
        telefone: lead.telefone,
        cidade: 'São Paulo',
        uf: 'SP'
      };
      DB.customers.push(cust);
      lead.clienteId = cust.id;
    }

    const prod = DB.products.find(p => p.id === lead.modeloId) || DB.products[0];
    const qNum = seq(DB.quotations, 'seqQuotPrefix', 'COT-');

    const newQuot = {
      id: uid('quot'),
      numero: qNum,
      titulo: `Proposta Comercial — Impressora ${prod.descricao}`,
      clienteId: cust.id,
      clienteNome: cust.nome,
      productId: prod.id,
      modeloMaquina: prod.descricao,
      valorEstimado: lead.valorEstimado || prod.precoReferencia || 12000000,
      prioridade: 'normal',
      status: 'aguardando_aprovacao',
      leadId: lead.id,
      criadoEm: today()
    };

    if (!DB.quotations) DB.quotations = [];
    DB.quotations.push(newQuot);
    lead.status = 'proposta';
    commit();
    toast(`Cotação ${qNum} gerada com sucesso! Redirecionando...`, 'success');
    App.go('/cotacoes');
  },

  aprovarCotacaoEGerarPedidoVenda(quotId){
    const q = DB.quotations.find(x => x.id === quotId);
    if (!q) return;

    const cust = DB.customers.find(c => c.id === q.clienteId) || { id: 'c1', nome: q.clienteNome || 'Cliente JP3D' };
    const prod = DB.products.find(p => p.id === q.productId) || DB.products[0];

    const salesOrderNum = seq(DB.salesOrders, 'seqSalesPrefix', 'PV-');
    const newSalesOrder = {
      id: uid('pv'),
      numero: salesOrderNum,
      clienteId: cust.id,
      clienteNome: cust.nome,
      productId: prod.id,
      modeloMaquina: prod.descricao,
      quantidade: 1,
      valorTotal: q.valorFinal || q.valorEstimado || prod.precoReferencia || 12000000,
      dataPrometida: new Date(Date.now() + 15 * 86400000).toISOString().slice(0, 10),
      status: 'confirmado',
      quotationId: q.id,
      criadoEm: today()
    };

    if (!DB.salesOrders) DB.salesOrders = [];
    DB.salesOrders.push(newSalesOrder);

    q.status = 'convertida_pedido';
    if (q.leadId) {
      const lead = (DB.crmLeads || []).find(l => l.id === q.leadId);
      if (lead) lead.status = 'fechado_ganho';
    }

    // DISPARO AUTOMÁTICO DE ORDEM DE PRODUÇÃO (OP)
    const opNum = seq(DB.productionOrders, 'seqOpPrefix', 'OP-2026-');
    const bomActive = (DB.bomVersions || []).find(b => b.productId === prod.id && b.status === 'ativa') || DB.bomVersions[0];

    const newOP = {
      id: uid('op'),
      numero: opNum,
      clienteId: cust.id,
      clienteNome: cust.nome,
      salesOrderId: newSalesOrder.id,
      productId: prod.id,
      modeloMaquina: prod.descricao,
      bomVersionId: bomActive ? bomActive.id : 'bom-cv1200',
      quantidade: 1,
      etapaAtualIndex: 0,
      etapaAtual: 'Montagem Estrutural & Guias Lineares',
      sequenciaAtual: 10,
      status: 'aguardando_material',
      historicoEtapas: [{
        etapa: 'Geração Automática via Pedido de Venda',
        sequencia: 0,
        usuario: (DB.currentUser && DB.currentUser.name) || 'Sistema PCP',
        timestamp: new Date().toLocaleString('pt-BR')
      }],
      criadoEm: today()
    };

    DB.productionOrders.push(newOP);

    // CHECAGEM AUTOMÁTICA PCP DO ESTOQUE
    App.avaliarNecessidadeMateriaisOP(newOP.id);

    commit();
    toast(`Pedido de Venda ${salesOrderNum} e OP ${opNum} gerados automaticamente!`, 'success');
    render();
  },

  avaliarNecessidadeMateriaisOP(opId){
    const op = DB.productionOrders.find(o => o.id === opId);
    if (!op) return;

    const bomId = op.bomVersionId || 'bom-cv1200';
    const bomItems = (DB.bomItems || []).filter(b => b.bomVersionId === bomId);
    const depValidos = (DB.warehouses || []).filter(w => w.ativo && !['refugo','terceiros'].includes(w.tipo)).map(w => w.id);

    let faltantesCount = 0;

    bomItems.forEach(item => {
      const prod = (DB.products || []).find(p => p.id === item.componentProductId);
      if (!prod) return;

      const necessarioMilli = (item.quantidade || 1000) * (op.quantidade || 1);
      const disponivelMilli = (DB.stockBalances || [])
        .filter(b => b.productId === prod.id && depValidos.includes(b.warehouseId))
        .reduce((acc, b) => acc + b.quantidade, 0);

      if (disponivelMilli < necessarioMilli) {
        faltantesCount++;
        const faltaMilli = necessarioMilli - disponivelMilli;

        const reqId = uid('req');
        const reqNum = seq(DB.requisitions, 'seqReqPrefix', 'REQ-');

        DB.requisitions.push({
          id: reqId,
          numero: reqNum,
          opId: op.id,
          opNumero: op.numero,
          solicitanteId: (DB.currentUser && DB.currentUser.id) || 'usr-pcp',
          solicitanteNome: 'Automação PCP (OP ' + op.numero + ')',
          setor: 'Produção',
          prioridade: 'alta',
          status: 'aprovada',
          observacoes: `Necessidade automática para atender OP ${op.numero} (${op.modeloMaquina})`,
          criadoEm: today()
        });

        DB.requisitionItems.push({
          id: uid('reqit'),
          requisitionId: reqId,
          productId: prod.id,
          descricao: prod.descricao,
          unidade: prod.unidade || 'UN',
          quantidade: faltaMilli,
          precoEstimado: prod.precoReferencia || 0
        });
      }
    });

    if (faltantesCount > 0) {
      op.status = 'aguardando_material';
      log('productionOrder', op.id, `PCP identificou ${faltantesCount} insumo(s) faltantes na BOM. Sugestão de Compra gerada.`);
    } else {
      op.status = 'separacao_pendente';
      log('productionOrder', op.id, `PCP confirmou 100% dos insumos em estoque. OP liberada para fabricação.`);
    }
  },

  baixarEstoqueMateriaisOP(opId){
    const op = DB.productionOrders.find(o => o.id === opId);
    if (!op || op.estoqueBaixado) return;

    const bomId = op.bomVersionId || 'bom-cv1200';
    const bomItems = (DB.bomItems || []).filter(b => b.bomVersionId === bomId);
    const mainWh = (DB.warehouses || []).find(w => w.ativo && w.tipo === 'materia_prima') || DB.warehouses[0];

    bomItems.forEach(item => {
      const prod = (DB.products || []).find(p => p.id === item.componentProductId);
      if (!prod) return;

      const consumidoMilli = (item.quantidade || 1000) * (op.quantidade || 1);

      let bal = (DB.stockBalances || []).find(b => b.productId === prod.id && b.warehouseId === mainWh.id);
      if (!bal) {
        bal = { id: uid('bal'), productId: prod.id, warehouseId: mainWh.id, quantidade: 0 };
        DB.stockBalances.push(bal);
      }
      bal.quantidade = Math.max(0, bal.quantidade - consumidoMilli);

      DB.stockMovements.push({
        id: uid('mov'),
        productId: prod.id,
        warehouseId: mainWh.id,
        tipo: 'saida_producao',
        quantidade: consumidoMilli,
        opId: op.id,
        opNumero: op.numero,
        data: today(),
        observacao: `Consumo automático de BOM para fabricação da OP ${op.numero}`
      });
    });

    op.estoqueBaixado = true;
    log('productionOrder', op.id, `Baixa automática de materiais consumidos na BOM realizada para a OP ${op.numero}`);
  },

  modalChecklistQC(opId){
    const op = DB.productionOrders.find(o => o.id === opId);
    if (!op) return;

    dialog({
      title: `Controle de Qualidade (QC) — OP ${op.numero}`,

      body: `

            </div>

          </div>

          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Checklist Obrigatório de Liberação para Expedição:</p>
          <div class="space-y-2">
            ${[
              { id: 'qc1', label: '1. Esquadro Estrutural CNC & Guias Lineares HHW/MGN12' },
              { id: 'qc2', label: '2. Chicote Elétrico Industrial & MCU Klipper Linux 64bit' },
              { id: 'qc3', label: '3. Extrusor Direct Drive 100% Metálico & Hotend 300°C' },

                <input type="checkbox" id="${item.id}" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 cursor-pointer" checked />
                <span>${item.label}</span>
              </label>
            `).join('')}
          </div>
        </div>`,
      footer: `${btn('Cancelar',{variant:'ghost',action:'this.closest(".fixed").remove()'})}${btn('Aprovar QC & Gerar Nº Série',{variant:'primary',action:`App.aprovarQCLaudo('${op.id}')`})}`
    });
  },

  aprovarQCLaudo(opId){
    const op = DB.productionOrders.find(o => o.id === opId);
    if (!op) return;

    const serialNum = `SN-JP3D-2026-${Math.floor(1000 + Math.random() * 9000)}`;

  login(e){
    e.preventDefault();
    const u = document.getElementById('logUser').value.trim();
    const p = document.getElementById('logPass').value;
    const remember = document.getElementById('chkRememberUser')?.checked;
    
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    }).then(res => res.json()).then(data => {
      if(data.success && data.token){
        sessionStorage.setItem('jp3d_token', data.token);
        sessionStorage.setItem('jp3d_user_id', data.user.id);
        let user = DB.users.find(x => x.id === data.user.id);
        if(!user){
          user = { id: data.user.id, name: data.user.name, email: data.user.email, roleId: data.user.roleId, active: true };
          DB.users.push(user);
        }
        DB.currentUser = user;
        if(remember){
          localStorage.setItem('cotalis_remembered_user', u);
        } else {
          localStorage.removeItem('cotalis_remembered_user');
        }
        document.getElementById('loginScreen').classList.add('hidden');
        render();
        toast(`Bem-vindo, ${user.name}!`, 'success');
      } else {
        const user = DB.users.find(x => (x.name.toLowerCase() === u.toLowerCase() || x.email.toLowerCase() === u.toLowerCase()) && x.password === p && x.active);
        if(user){
          DB.currentUser = user;
          sessionStorage.setItem('jp3d_user_id', user.id);
          document.getElementById('loginScreen').classList.add('hidden');
          render();
          toast(`Bem-vindo, ${user.name}!`, 'success');
        } else {
          document.getElementById('loginErr').classList.remove('hidden');
        }
      }
    }).catch(() => {
      const user = DB.users.find(x => (x.name.toLowerCase() === u.toLowerCase() || x.email.toLowerCase() === u.toLowerCase()) && x.password === p && x.active);
      if(user){
        DB.currentUser = user;
        sessionStorage.setItem('jp3d_user_id', user.id);
        document.getElementById('loginScreen').classList.add('hidden');
        render();
        toast(`Bem-vindo, ${user.name}!`, 'success');
      } else {
        document.getElementById('loginErr').classList.remove('hidden');
      }
    });
  },

  apontarEtapaChaoFabrica(opId, targetStepIdx){
    const op = DB.productionOrders.find(o => o.id === opId);
    if(!op) return;

    const etapas = getEtapasProducao(op);
    if(targetStepIdx < 0) return;

    const user = getCurrentUser() || { name: 'Operador Chão de Fábrica' };
    const stamp = new Date().toLocaleString('pt-BR');
    if(!op.historicoEtapas) op.historicoEtapas = [];

    if(targetStepIdx >= etapas.length){
      op.status = 'concluida';
      op.etapaAtualIndex = etapas.length - 1;
      op.etapaAtual = etapas[etapas.length - 1].nome;
      op.quantidadeProduzida = op.quantidade;

      op.historicoEtapas.push({ etapa: op.etapaAtual, sequencia: 999, usuario: user.name, timestamp: stamp });
      log('productionOrder', op.id, `OP ${op.numero} totalmente concluída no chão de fábrica por ${user.name}`);
      commit();
      render();
      toast(`OP ${op.numero} CONCLUÍDA COM SUCESSO!`, 'success');
      return;
    }

    const stepObj = etapas[targetStepIdx];
    op.etapaAtualIndex = targetStepIdx;
    op.etapaAtual = stepObj.nome;
    op.sequenciaAtual = stepObj.sequencia;
    op.status = 'em_producao';

    op.historicoEtapas.push({
      etapa: stepObj.nome,
      sequencia: stepObj.sequencia,
      usuario: user.name,
      timestamp: stamp
    });

    log('productionOrder', op.id, `Etapa "${stepObj.nome}" apontada por ${user.name} em ${stamp}`);
    commit();
    render();
    toast(`Etapa "${stepObj.nome}" gravada por ${user.name}!`, 'success');
  },

  reordenarEtapaProducaoBOM(ropId, direction){
    const rop = DB.routingOperations.find(r => r.id === ropId);
    if(!rop) return;

    let rops = DB.routingOperations.filter(r => r.bomVersionId === rop.bomVersionId || r.productId === rop.productId);
    rops.sort((a, b) => (a.sequencia || 0) - (b.sequencia || 0));

    const idx = rops.findIndex(r => r.id === ropId);
    if(idx < 0) return;

    const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
    if(targetIdx < 0 || targetIdx >= rops.length) return;

    const tempSeq = rops[idx].sequencia || ((idx + 1) * 10);
    rops[idx].sequencia = rops[targetIdx].sequencia || ((targetIdx + 1) * 10);
    rops[targetIdx].sequencia = tempSeq;

    commit();
    render();
    toast('Ordem das etapas redefinida com sucesso!', 'info');
  },

  adicionarEtapaProducaoBOM(bomId){
    const bom = DB.bomVersions.find(b => b.id === bomId);
    if(!bom) return;

    let rops = DB.routingOperations.filter(r => r.bomVersionId === bomId || r.productId === bom.productId);
    rops.sort((a, b) => (a.sequencia || 0) - (b.sequencia || 0));

    const lastSeq = rops.length ? (rops[rops.length - 1].sequencia || rops.length * 10) : 0;
    const nextSeq = lastSeq + 10;

    const newRop = {
      id: uid('rop'),
      bomVersionId: bom.id,
      productId: bom.productId,
      sequencia: nextSeq,
      nome: `Nova Etapa ${rops.length + 1}`,
      instrucoes: 'Descreva aqui as instruções de execução para o operador no chão de fábrica...',
      tempoUnitarioMin: 60,
      workCenterId: 'wc-1'
    };

    DB.routingOperations.push(newRop);
    commit();
    render();
    toast(`Nova etapa (SEQ ${nextSeq}) adicionada!`, 'success');
  },

  removerEtapaProducaoBOM(ropId){
    const rop = DB.routingOperations.find(r => r.id === ropId);
    if(!rop) return;

    confirmDialog('Excluir Etapa de Produção', `Tem certeza que deseja excluir a etapa "${rop.nome}"?`, () => {
      DB.routingOperations = DB.routingOperations.filter(r => r.id !== ropId);
      commit();
      render();
      toast('Etapa removida com sucesso!', 'success');
    });
  },

    });

    const targetBtn = tipo === 'PA' ? document.getElementById('btnTipoPA') : (tipo === 'MUC' ? document.getElementById('btnTipoMUC') : document.getElementById('btnTipoMP'));
    if(targetBtn){
      targetBtn.classList.remove('border-slate-200', 'dark:border-slate-700', 'text-slate-600', 'dark:text-slate-300');
      targetBtn.classList.add('border-brand-600', 'bg-brand-50', 'dark:bg-brand-950/40', 'text-brand-700', 'dark:text-brand-300', 'ring-2', 'ring-brand-600/40');
    }

    const fMPMUC = document.getElementById('fieldsMP_MUC');
    const fPA = document.getElementById('fieldsPA');
    const extraMP = document.getElementById('extraMPOnly');

    if(tipo === 'PA'){
      if(fMPMUC) fMPMUC.classList.add('hidden');
      if(fPA) fPA.classList.remove('hidden');
    } else {
      if(fMPMUC) fMPMUC.classList.remove('hidden');
      if(fPA) fPA.classList.add('hidden');
      if(extraMP) extraMP.classList.toggle('hidden', tipo === 'MUC');
    }
