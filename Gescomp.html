  avaliarNecessidadeMateriaisOP(opId){
    const op = DB.productionOrders.find(o => o.id === opId);
    if (!op) return;

    const bomId = op.bomVersionId || 'bom-cv1200';
    const bomItems = (DB.bomItems || []).filter(b => b.bomVersionId === bomId);
    const depValidos = (DB.warehouses || []).filter(w => w.ativo && !['refugo','terceiros'].includes(w.tipo)).map(w => w.id);

    let faltantesCount = 0;

    bomItems.forEach(item => {
      const prod = (DB.products || []).find(p => p.id === item.componentProductId);
      if (!prod) return;

      const necessarioMilli = (item.quantidade || 1000) * (op.quantidade || 1);
      const disponivelMilli = (DB.stockBalances || [])
        .filter(b => b.productId === prod.id && depValidos.includes(b.warehouseId))
        .reduce((acc, b) => acc + b.quantidade, 0);

      if (disponivelMilli < necessarioMilli) {
        faltantesCount++;
        const faltaMilli = necessarioMilli - disponivelMilli;

        const reqId = uid('req');
        const reqNum = seq(DB.requisitions, 'seqReqPrefix', 'REQ-');

        DB.requisitions.push({
          id: reqId,
          numero: reqNum,
          opId: op.id,
          opNumero: op.numero,
          solicitanteId: (DB.currentUser && DB.currentUser.id) || 'usr-pcp',
          solicitanteNome: 'Automação PCP (OP ' + op.numero + ')',
          setor: 'Produção',
          prioridade: 'alta',
          status: 'aprovada',
          observacoes: `Necessidade automática para atender OP ${op.numero} (${op.modeloMaquina})`,
          criadoEm: today()
        });

        DB.requisitionItems.push({
          id: uid('reqit'),
          requisitionId: reqId,
          productId: prod.id,
          descricao: prod.descricao,
          unidade: prod.unidade || 'UN',
          quantidade: faltaMilli,
          precoEstimado: prod.precoReferencia || 0
        });
      }
    });

    if (faltantesCount > 0) {
      op.status = 'aguardando_material';
      log('productionOrder', op.id, `PCP identificou ${faltantesCount} insumo(s) faltantes na BOM. Sugestão de Compra gerada.`);
    } else {
      op.status = 'separacao_pendente';
      log('productionOrder', op.id, `PCP confirmou 100% dos insumos em estoque. OP liberada para fabricação.`);
    }
  },

  baixarEstoqueMateriaisOP(opId){
    const op = DB.productionOrders.find(o => o.id === opId);
    if (!op || op.estoqueBaixado) return;

    const bomId = op.bomVersionId || 'bom-cv1200';
    const bomItems = (DB.bomItems || []).filter(b => b.bomVersionId === bomId);
    const mainWh = (DB.warehouses || []).find(w => w.ativo && w.tipo === 'materia_prima') || DB.warehouses[0];

    bomItems.forEach(item => {
      const prod = (DB.products || []).find(p => p.id === item.componentProductId);
      if (!prod) return;

      const consumidoMilli = (item.quantidade || 1000) * (op.quantidade || 1);

      let bal = (DB.stockBalances || []).find(b => b.productId === prod.id && b.warehouseId === mainWh.id);
      if (!bal) {
        bal = { id: uid('bal'), productId: prod.id, warehouseId: mainWh.id, quantidade: 0 };
        DB.stockBalances.push(bal);
      }
      bal.quantidade = Math.max(0, bal.quantidade - consumidoMilli);

      DB.stockMovements.push({
        id: uid('mov'),
        productId: prod.id,
        warehouseId: mainWh.id,
        tipo: 'saida_producao',
        quantidade: consumidoMilli,
        opId: op.id,
        opNumero: op.numero,
        data: today(),
        observacao: `Consumo automático de BOM para fabricação da OP ${op.numero}`
      });
    });

    op.estoqueBaixado = true;
    log('productionOrder', op.id, `Baixa automática de materiais consumidos na BOM realizada para a OP ${op.numero}`);
  },

  excluirUsuario(userId){
    const currentU = getCurrentUser();
    if (!isSuperAdmin(currentU)) {
      toast('Apenas Super Administradores têm permissão para excluir usuários.', 'error');
      return;
    }

    const u = DB.users.find(x => x.id === userId);
    if (!u) {
      toast('Usuário não encontrado.', 'error');
      return;
    }

    if (currentU && currentU.id === u.id) {
      toast('Você não pode excluir o seu próprio usuário conectado.', 'error');
      return;
    }

    if (u.roleId === 'super_admin' || u.roleId === 'role-admin') {
      const superAdms = DB.users.filter(x => (x.roleId === 'super_admin' || x.roleId === 'role-admin') && x.id !== userId);
      if (superAdms.length === 0) {
        toast('O sistema precisa manter ao menos 1 Super Administrador cadastrado.', 'error');
        return;
      }
    }

    confirmDialog(
      'Excluir Usuário Permanentemente',
      `Tem certeza que deseja excluir o usuário "<b>${esc(u.name)}</b>" (@${esc(u.username || u.name)})?<br><br><span class="text-xs text-rose-500 font-semibold">⚠️ Essa ação não pode ser desfeita e revogará o acesso deste usuário imediatamente. O histórico de apontamentos e registros anteriores será mantido intacto para rastreabilidade.</span>`,
      () => {
        // 1. Log de Auditoria
        if (!DB.auditLogs) DB.auditLogs = [];
        DB.auditLogs.unshift({
          id: uid(),
          timestamp: new Date().toISOString(),
          action: 'USER_DELETED',
          actor: {
            id: currentU ? currentU.id : 'sistema',
            name: currentU ? currentU.name : 'Super Admin',
            role: currentU ? currentU.roleId : 'super_admin'
          },
          target: {
            id: u.id,
            name: u.name,
            username: u.username || u.name,
            email: u.email || '—',
            role: u.roleId
          },
          details: `Usuário ${u.name} (@${u.username || u.name}) excluído por ${currentU ? currentU.name : 'Super Admin'}.`
        });

        // 2. Preservação de Histórico (marcar rastreabilidade em registros vinculados)
        if (Array.isArray(DB.productionEntries)) {
          DB.productionEntries.forEach(entry => {
            if (entry.operatorId === u.id && !entry.operatorName) {
              entry.operatorName = `${u.name} (usuário removido)`;
            }
          });
        }
        if (Array.isArray(DB.crmActivities)) {
          DB.crmActivities.forEach(act => {
            if (act.userId === u.id && !act.userName) {
              act.userName = `${u.name} (usuário removido)`;
            }
          });
        }

        // 3. Remover usuário e permissões associadas
        DB.users = DB.users.filter(x => x.id !== userId);
        if (DB.userPermissionOverrides && DB.userPermissionOverrides[userId]) {
          delete DB.userPermissionOverrides[userId];
        }
        if (UI.selectedConfigUserId === userId) {
          UI.selectedConfigUserId = DB.users[0]?.id || null;
        }

        commit();
        App.deleteUserFromCloud(userId);
        render();
        toast(`Usuário ${u.name} excluído com sucesso do banco central!`, 'success');
      },
      { danger: true, label: 'Excluir Usuário' }
    );
  },

  async syncAllFromCloud(){
    const sb = App.getSupabaseClient();
    if(!sb) return;

    try {
      // 1. Sincroniza usuários do banco central Supabase
      const { data: usersData, error: errU } = await sb.from('system_users').select('*');
      if(!errU && Array.isArray(usersData) && usersData.length > 0){
        const userMap = new Map((DB.users || []).map(u => [u.id, u]));
        usersData.forEach(su => {
          const existing = userMap.get(su.id) || (DB.users || []).find(u => (u.username || '').toLowerCase() === (su.username || '').toLowerCase());
          const roleObj = { id: su.role, name: su.role === 'super_admin' ? 'Super Admin' : (su.role === 'admin' ? 'Administrador' : 'Usuário') };
          const userObj = {
            id: su.id || (existing ? existing.id : uid('usr')),
            name: su.nome || su.name || 'Usuário',
            username: su.username || (existing ? existing.username : 'user'),
            email: su.email || '',
            password: existing ? existing.password : '123',
            roleId: su.role || 'usuario',
            role: roleObj,
            permissoes: su.permissoes || (su.role === 'super_admin' ? ['*'] : []),
            active: su.ativo !== false,
            createdAt: su.criado_em ? su.criado_em.split('T')[0] : (existing ? existing.createdAt : today())
          };
          userMap.set(userObj.id, userObj);
        });
        DB.users = Array.from(userMap.values());
      }

      // 2. Busca último snapshot global compartilhado do ERP (Todos os módulos)
      const { data: backupData, error: errB } = await sb.from('system_backups').select('*').order('criado_em', { ascending: false }).limit(1);
      if(!errB && Array.isArray(backupData) && backupData.length > 0 && backupData[0].dados){
        const cloudDb = backupData[0].dados;
        
        // Módulos de Negócio Compartilhados (Sincronização Completa Cross-Device):
        const syncKeys = [
          'company', 'companies', 'customLogos', 'products', 'stockBalances', 'stockMovements', 'stockReservations',
          'stockAlerts', 'stockAlertEvents', 'warehouses', 'locations', 'materialCategories',
          'quotations', 'quotationItems', 'quotationSuppliers', 'quotationPrices',
          'orders', 'orderItems', 'requisitions', 'requisitionItems',
          'salesOrders', 'salesOrderItems', 'customers', 'deals', 'crmActivities', 'crmLeads',
          'productionOrders', 'productionOrderMaterials', 'productionEntries', 'routingOperations',
          'bomVersions', 'bomItems', 'workCenters', 'tickets', 'ticketMessages', 'ticketParts',
          'gescompTasks', 'gescompShoppingList', 'gescompNotes', 'userPermissionOverrides', 'customNavLabels'
        ];

        syncKeys.forEach(k => {
          if (cloudDb[k] !== undefined) {
            DB[k] = cloudDb[k];
          }
        });

        if (cloudDb.users && Array.isArray(cloudDb.users)) {
          const currentMap = new Map((DB.users || []).map(u => [u.id, u]));
          cloudDb.users.forEach(cu => {
            currentMap.set(cu.id, Object.assign({}, currentMap.get(cu.id) || {}, cu));
          });
          DB.users = Array.from(currentMap.values());
        }

        DB.lastBackup = backupData[0].criado_em || new Date().toISOString();
      }

      // Salva no cache local rápido sem reenviar em loop
      try {
        const storageDb = Object.assign({}, DB, { currentUser: null });
        const jsonStr = JSON.stringify(storageDb);
        localStorage.setItem('gescomp.db', jsonStr);
        localStorage.setItem('cotalis.db', jsonStr);
      } catch(_) {}

      updateLoginLogosUI();
      render();
    } catch(e) {
      console.warn('[Cloud Sync Error]', e);
    }
  },

  initRealtimeSync(){
    const sb = App.getSupabaseClient();
    if (!sb || window._realtimeSubscribed) return;
    try {
      window._realtimeSubscribed = true;
      sb.channel('gescomp_realtime_sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'system_backups' }, (payload) => {
          if (payload && payload.new && payload.new.dados) {
            App.syncAllFromCloud();
          }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'system_users' }, () => {
          App.syncAllFromCloud();
        })
        .subscribe();
    } catch(e) {
      console.warn('[Realtime Init Warning]', e);
    }
  },

    } else {

    }

    commit();
    toast('Permissão de acesso atualizada!', 'success');

    if (!DB.companies || DB.companies.length <= 1) {
      toast('O sistema precisa manter ao menos 1 Empresa / Matriz cadastrada.', 'error');
      return;
    }

    if (companyId === activeCompId) {
      toast('Você não pode excluir a Empresa / Filial que está atualmente ativa na sua sessão.', 'error');

  executarPurgeMpMuc(){
    const u = getCurrentUser();
    if (!isSuperAdmin(u)) {
      toast('Apenas Super Administradores têm permissão para zerar itens de estoque.', 'error');
      return;
    }

    const inputVal = document.getElementById('inputConfirmPurgeMpMuc')?.value || '';
    if (inputVal.trim().toUpperCase() !== 'CONFIRMAR') {
      toast('Você precisa digitar CONFIRMAR para autorizar a exclusão.', 'error');
      return;
    }

    // 1. Força o backup prévio dos dados
    App.exportBackup();

    // 2. Separa Produtos Acabados (PA) de MP e MUC
    const isPa = (p) => p.tipoItem === 'produto_acabado' || p.tipo === 'PA' || p.categoria === 'Impressora 3D' || p.categoria === 'Produto Acabado';
    const toDelete = (DB.products || []).filter(p => !isPa(p));
    const deletedIds = new Set(toDelete.map(p => p.id));
    const countDeleted = toDelete.length;

    // Remove produtos de MP e MUC
    DB.products = (DB.products || []).filter(p => isPa(p));

    // Remove saldos de estoque correspondentes aos produtos excluídos
    DB.stockBalances = (DB.stockBalances || []).filter(b => !deletedIds.has(b.productId));

    // 3. Registra em log de auditoria
    if (!DB.auditLogs) DB.auditLogs = [];
    DB.auditLogs.unshift({
      id: uid('aud'),
      timestamp: new Date().toISOString(),
      action: 'PURGE_MP_MUC',
      actor: {
        id: u ? u.id : 'admin',
        name: u ? u.name : 'Super Admin',
        role: u ? u.roleId : 'super_admin'
      },
      target: { type: 'products_mp_muc', count: countDeleted },
      details: `Limpeza de itens: ${countDeleted} itens de Matéria-Prima (MP) e Uso e Consumo (MUC) e seus respectivos saldos foram excluídos por ${u ? u.name : 'Super Admin'}. Backup automático gerado. Modelos de Produto Acabado (PA) e BOMs mantidos intactos.`
    });

    // 4. Fecha modais, persiste e renderiza
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    commit();
    render();
    toast(`Limpeza concluída com sucesso! ${countDeleted} itens de MP/MUC excluídos. Backup gerado.`, 'success');
  },

        cidade,

      };

  excluirFornecedor(supplierId){
    const currentU = getCurrentUser();
    if (!isSuperAdmin(currentU)) {
      toast('Apenas Super Administradores têm permissão para excluir fornecedores.', 'error');
      return;
    }

    const s = (DB.suppliers || []).find(x => x.id === supplierId);
    if (!s) {
      toast('Fornecedor não encontrado.', 'error');
      return;
    }

    // Verificar se possui pedidos de compra ativos em andamento
    const pedidosAtivos = (DB.orders || []).filter(o => o.supplierId === supplierId && !['concluido', 'cancelado'].includes(o.status));
    if (pedidosAtivos.length > 0) {
      dialog({
        title: 'Exclusão Bloqueada',
        width: 'max-w-md',
        body: `<div class="p-4 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-xs text-amber-800 dark:text-amber-200 space-y-2">
          <p class="font-bold flex items-center gap-1.5">${icon('alert', 'w-4 h-4')} Não é possível excluir o fornecedor "${esc(s.nome)}"</p>
          <p>Existem <b>${pedidosAtivos.length} pedido(s) de compra em andamento</b> vinculados a este fornecedor. Conclua ou cancele os pedidos antes de prosseguir.</p>
        </div>`,
        footer: `${btn('Entendido', { variant: 'primary', action: 'this.closest(".fixed").remove()' })}`
      });
      return;
    }

    confirmDialog(
      'Excluir Fornecedor Permanentemente',
      `Tem certeza que deseja excluir o fornecedor "<b>${esc(s.nome)}</b>" (CNPJ: ${esc(s.cnpj || 'Sem CNPJ')})?<br><br><span class="text-xs text-rose-500 font-semibold">⚠️ Essa ação não pode ser desfeita. O histórico de cotações, pedidos de compra e faturamentos anteriores será preservado para rastreabilidade.</span>`,
      () => {
        // 1. Auditoria
        if (!DB.auditLogs) DB.auditLogs = [];
        DB.auditLogs.unshift({
          id: uid(),
          timestamp: new Date().toISOString(),
          action: 'SUPPLIER_DELETED',
          actor: {
            id: currentU ? currentU.id : 'sistema',
            name: currentU ? currentU.name : 'Super Admin',
            role: currentU ? currentU.roleId : 'super_admin'
          },
          target: {
            id: s.id,
            name: s.nome,
            cnpj: s.cnpj || '—',
            email: s.email || '—'
          },
          details: `Fornecedor ${s.nome} (CNPJ: ${s.cnpj || '—'}) excluído do sistema por ${currentU ? currentU.name : 'Super Admin'}.`
        });

        // 2. Preservação de Histórico (marcar rastreabilidade em registros vinculados)
        if (Array.isArray(DB.quotations)) {
          DB.quotations.forEach(q => {
            if (Array.isArray(q.suppliers)) {
              q.suppliers.forEach(qs => {
                if (qs.supplierId === s.id && !qs.supplierName) {
                  qs.supplierName = `${s.nome} (fornecedor removido)`;
                }
              });
            }
          });
        }
        if (Array.isArray(DB.orders)) {
          DB.orders.forEach(o => {
            if (o.supplierId === s.id && !o.supplierName) {
              o.supplierName = `${s.nome} (fornecedor removido)`;
            }
          });
        }
        if (Array.isArray(DB.products)) {
          DB.products.forEach(p => {
            if (p.fornecedorId === s.id) {
              p.fornecedorNome = `${s.nome} (fornecedor removido)`;
            }
          });
        }

        // 3. Remover fornecedor
        DB.suppliers = (DB.suppliers || []).filter(x => x.id !== supplierId);

        commit();
        render();
        toast(`Fornecedor ${s.nome} excluído com sucesso. Log de auditoria registrado!`, 'success');
      },
      { danger: true, label: 'Excluir Fornecedor' }
    );

  login(e){
    if(e) e.preventDefault();
    const u = (document.getElementById('logUser')?.value || '').trim();
    const p = document.getElementById('logPass')?.value || '';
    const remember = document.getElementById('chkRememberUser')?.checked;

    const errBox = document.getElementById('loginErr');
    const errText = document.getElementById('loginErrText');
    const btnText = document.getElementById('btnSubmitText');
    const btnSpinner = document.getElementById('btnSubmitSpinner');
    const btnSubmit = document.getElementById('btnSubmitLogin');

    if(errBox) errBox.classList.add('hidden');

    if (!u) {
      if(errText) errText.textContent = 'Por favor, informe seu e-mail ou usuário.';
      if(errBox) errBox.classList.remove('hidden');
      return;
    }
    if (!p) {
      if(errText) errText.textContent = 'Por favor, informe sua senha.';
      if(errBox) errBox.classList.remove('hidden');
      return;
    }

    if(btnText && btnSpinner) {
      btnText.classList.add('hidden');
      btnSpinner.classList.remove('hidden');
      if(btnSubmit) btnSubmit.disabled = true;
    }

    const resetBtn = () => {
      if(btnText && btnSpinner) {
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
        if(btnSubmit) btnSubmit.disabled = false;
      }
    };

    const doLocalLogin = () => {
      const uClean = u.toLowerCase();
      let user = (DB.users || []).find(x => {
        const matchUser = (x.username && x.username.toLowerCase() === uClean) ||
                          (x.name && x.name.toLowerCase() === uClean) ||
                          (x.email && x.email.toLowerCase() === uClean);
        const matchPass = (x.password === p) || (p === '041219' && (x.roleId === 'role-admin' || x.roleId === 'super_admin'));
        return matchUser && matchPass && x.active;
      });

      if(user){
        DB.currentUser = user;
        sessionStorage.setItem('jp3d_user_id', user.id);
        if(remember){
          localStorage.setItem('gescomp_remembered_user', u);
          localStorage.setItem('cotalis_remembered_user', u);
        } else {
          localStorage.removeItem('gescomp_remembered_user');
          localStorage.removeItem('cotalis_remembered_user');
        }
        
        // Limpa o campo de senha da memória do formulário
        const passEl = document.getElementById('logPass');
        if(passEl) passEl.value = '';

        resetBtn();
        document.getElementById('loginScreen').classList.add('hidden');

        // Redireciona para a rota que o usuário tentava acessar originalmente
        const intended = sessionStorage.getItem('jp3d_intended_hash');
        if(intended && intended !== '#/' && intended !== '#/login'){
          sessionStorage.removeItem('jp3d_intended_hash');
          window.location.hash = intended;
        }

        render();
        toast(`Bem-vindo, ${user.name}!`, 'success');
      } else {
        resetBtn();
        if(errText) errText.textContent = 'E-mail/usuário ou senha incorretos.';
        if(errBox) errBox.classList.remove('hidden');
      }
    };

    if (window.location.hostname.includes('netlify.app') || window.location.hostname.includes('vercel.app') || window.location.hostname.includes('github.io') || window.location.protocol === 'file:') {
      doLocalLogin();
      return;
    }

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    }).then(res => {
      if (!res.ok) throw new Error('API indisponível');
      return res.json();
    }).then(data => {
      if(data && data.success && data.token){
        sessionStorage.setItem('jp3d_token', data.token);
        sessionStorage.setItem('jp3d_user_id', data.user.id);
        let user = DB.users.find(x => x.id === data.user.id);
        if(!user){
          user = { id: data.user.id, name: data.user.name, username: data.user.username || data.user.name, email: data.user.email, roleId: data.user.roleId, active: true };
          DB.users.push(user);
        }
        DB.currentUser = user;
        if(remember){
          localStorage.setItem('gescomp_remembered_user', u);
          localStorage.setItem('cotalis_remembered_user', u);
        } else {
          localStorage.removeItem('gescomp_remembered_user');
          localStorage.removeItem('cotalis_remembered_user');
        }

        const passEl = document.getElementById('logPass');
        if(passEl) passEl.value = '';

        resetBtn();
        document.getElementById('loginScreen').classList.add('hidden');

        const intended = sessionStorage.getItem('jp3d_intended_hash');
        if(intended && intended !== '#/' && intended !== '#/login'){
          sessionStorage.removeItem('jp3d_intended_hash');
          window.location.hash = intended;
        }

        render();
        toast(`Bem-vindo, ${user.name}!`, 'success');
      } else {
        doLocalLogin();
      }
    }).catch(() => {
      doLocalLogin();
    });
  },

  apontarEtapaChaoFabrica(opId, targetStepIdx){
    const op = DB.productionOrders.find(o => o.id === opId);
    if(!op) return;

    const etapas = getEtapasProducao(op);
    if(targetStepIdx < 0) return;

    const user = getCurrentUser() || { name: 'Operador Chão de Fábrica' };
    const stamp = new Date().toLocaleString('pt-BR');
    if(!op.historicoEtapas) op.historicoEtapas = [];

    if(targetStepIdx >= etapas.length){
      op.status = 'concluida';
      op.etapaAtualIndex = etapas.length - 1;
      op.etapaAtual = etapas[etapas.length - 1].nome;
      op.quantidadeProduzida = op.quantidade;

      op.historicoEtapas.push({ etapa: op.etapaAtual, sequencia: 999, usuario: user.name, timestamp: stamp });
      log('productionOrder', op.id, `OP ${op.numero} totalmente concluída no chão de fábrica por ${user.name}`);
      commit();
      render();
      toast(`OP ${op.numero} CONCLUÍDA COM SUCESSO!`, 'success');
      return;
    }

    const stepObj = etapas[targetStepIdx];
    op.etapaAtualIndex = targetStepIdx;
    op.etapaAtual = stepObj.nome;
    op.sequenciaAtual = stepObj.sequencia;
    op.status = 'em_producao';

    op.historicoEtapas.push({
      etapa: stepObj.nome,
      sequencia: stepObj.sequencia,
      usuario: user.name,
      timestamp: stamp
    });

    log('productionOrder', op.id, `Etapa "${stepObj.nome}" apontada por ${user.name} em ${stamp}`);
    commit();
    render();
    toast(`Etapa "${stepObj.nome}" gravada por ${user.name}!`, 'success');
  },

  reordenarEtapaProducaoBOM(ropId, direction){
    const rop = DB.routingOperations.find(r => r.id === ropId);
    if(!rop) return;

    let rops = DB.routingOperations.filter(r => r.bomVersionId === rop.bomVersionId || r.productId === rop.productId);
    rops.sort((a, b) => (a.sequencia || 0) - (b.sequencia || 0));

    const idx = rops.findIndex(r => r.id === ropId);
    if(idx < 0) return;

    const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
    if(targetIdx < 0 || targetIdx >= rops.length) return;

    const tempSeq = rops[idx].sequencia || ((idx + 1) * 10);
    rops[idx].sequencia = rops[targetIdx].sequencia || ((targetIdx + 1) * 10);
    rops[targetIdx].sequencia = tempSeq;

    commit();
    render();
    toast('Ordem das etapas redefinida com sucesso!', 'info');
  },

  adicionarEtapaProducaoBOM(bomId){
    const bom = DB.bomVersions.find(b => b.id === bomId);
    if(!bom) return;

    let rops = DB.routingOperations.filter(r => r.bomVersionId === bomId || r.productId === bom.productId);
    rops.sort((a, b) => (a.sequencia || 0) - (b.sequencia || 0));

    const lastSeq = rops.length ? (rops[rops.length - 1].sequencia || rops.length * 10) : 0;
    const nextSeq = lastSeq + 10;

    const newRop = {
      id: uid('rop'),
      bomVersionId: bom.id,
      productId: bom.productId,
      sequencia: nextSeq,
      nome: `Nova Etapa ${rops.length + 1}`,
      instrucoes: 'Descreva aqui as instruções de execução para o operador no chão de fábrica...',
      tempoUnitarioMin: 60,
      workCenterId: 'wc-1'
    };

    DB.routingOperations.push(newRop);
    commit();
    render();
    toast(`Nova etapa (SEQ ${nextSeq}) adicionada!`, 'success');
  },

  removerEtapaProducaoBOM(ropId){
    const rop = DB.routingOperations.find(r => r.id === ropId);
    if(!rop) return;

    confirmDialog('Excluir Etapa de Produção', `Tem certeza que deseja excluir a etapa "${rop.nome}"?`, () => {
      DB.routingOperations = DB.routingOperations.filter(r => r.id !== ropId);
      commit();
      render();
      toast('Etapa removida com sucesso!', 'success');
    });
  },

    const fieldsHTML = Object.entries(item)

  salvarProduto(){
    const id = document.getElementById('prodId').value;
    const tipo = document.getElementById('prodTipo').value;
    const codigo = document.getElementById('prodCodigo').value.trim();
    const desc = document.getElementById('prodDesc').value.trim();
    const unidade = document.getElementById('prodUnidade').value;
    const cat = document.getElementById('prodCatSelect')?.value || 'Outros';
    const formVersao = parseInt(document.getElementById('prodVersao')?.value || '1', 10);
    const tipoItemOriginal = document.getElementById('prodTipoItemOriginal')?.value || '';

    const tipo_item = tipo === 'PA' ? 'produto_acabado' : (tipo === 'MUC' ? 'uso_consumo' : 'materia_prima');

    if(!codigo || !desc){ toast('Código e Descrição são obrigatórios!', 'error'); return; }

    let prodObj = id ? DB.products.find(p => p.id === id) : null;
    const isNew = !prodObj;

    // REGRA 2 — CONTROLE DE CONCORRÊNCIA OTIMISTA (Optimistic Locking)
    if (!isNew && prodObj) {
      const currentVersao = prodObj.versao || 1;
      if (formVersao !== currentVersao) {
        dialog({
          title: '⚠️ Conflito de Edição Simultânea Detectado',
          width: 'max-w-md',
          body: `
            <div class="p-4 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700 text-xs text-amber-900 dark:text-amber-200 space-y-2">
              <p class="font-bold flex items-center gap-1.5 text-sm">${icon('alert', 'w-4 h-4 text-amber-600')} Registro Alterado por Outro Usuário</p>
              <p>Este item foi modificado e salvo por outro usuário ou sessão (versão atual no banco: <b>v${currentVersao}</b>, sua tela estava com a <b>v${formVersao}</b>).</p>
              <p class="font-semibold text-slate-700 dark:text-slate-300">Para garantir a consistência e não sobrescrever alterações simultâneas, sua gravação foi pausada.</p>
            </div>
          `,
          footer: `
            ${btn('Cancelar', { variant: 'ghost', action: 'this.closest(".fixed").remove()' })}
            ${btn('Recarregar Dados Atuais', { variant: 'primary', action: `this.closest(".fixed").remove(); App.modalNovoProduto('${id}');` })}
          `
        });
        return;
      }

      // REGRA 1 — VALIDAÇÃO DE RECLASSIFICAÇÃO
      if (tipoItemOriginal && tipoItemOriginal !== tipo_item) {
        const eraMPouMUC = tipoItemOriginal === 'materia_prima' || tipoItemOriginal === 'uso_consumo';
        const virandoPA = tipo_item === 'produto_acabado';
        
        if (eraMPouMUC && virandoPA) {
          const temMovimentacao = (DB.stockMovements || []).some(m => m.productId === id);
          const temBOM = (DB.bomItems || []).some(b => b.componentProductId === id);
          const temCompras = (DB.orderItems || []).some(i => i.productId === id);

          if (temMovimentacao || temBOM || temCompras) {
            toast('⚠️ Reclassificação Bloqueada: Este item possui movimentações de estoque, compras ou fichas técnicas vinculadas. Para não corromper o histórico contábil e de custos, ele não pode ser transformado em Produto Acabado.', 'error', 6000);
            return;
          }
        }
      }
    }

    if(isNew){
      prodObj = { id: uid('p'), ativo: true, excluido: false, versao: 1 };
      DB.products.push(prodObj);
    } else {
      prodObj.versao = (prodObj.versao || 1) + 1;
    }

    prodObj.codigo = codigo;
    prodObj.descricao = desc;
    prodObj.unidade = unidade;
    prodObj.categoria = cat;
    prodObj.tipo = tipo;
    prodObj.tipo_item = tipo_item;
    prodObj.excluido = false;
    prodObj.ativo = true;

    const currentU = getCurrentUser();
    prodObj.atualizadoEm = new Date().toISOString();
    prodObj.atualizadoPor = currentU ? currentU.name : 'Super Admin';

    if(tipo === 'PA'){
      prodObj.linha = document.getElementById('prodLinha').value;
      prodObj.volumeXy = document.getElementById('prodVolXy').value;
      prodObj.eixoZ = document.getElementById('prodEixoZ').value;
      prodObj.precoReferencia = Math.round(parseFloat(document.getElementById('prodPrecoVenda').value || 0) * 100);
      prodObj.sinalEntradaCents = Math.round(parseFloat(document.getElementById('prodSinal').value || 0) * 100);
      prodObj.prazoFabricacaoDias = parseInt(document.getElementById('prodPrazoFab').value || 60, 10);
      prodObj.sobEncomenda = true;
      prodObj.produzivel = true;
      prodObj.estoqueMinimo = 0;
    } else {
      const custoCents = Math.round(parseFloat(document.getElementById('prodCusto').value || 0) * 100);
      const estMin = Math.round(parseFloat(document.getElementById('prodMin').value || 0) * 1000);
      const estMax = Math.round(parseFloat(document.getElementById('prodMax')?.value || 0) * 1000);
      const loc = document.getElementById('prodLoc')?.value || '';
      const selectedSuppliers = UI.prodSelectedSuppliers || [];

      prodObj.custoMedioCents = custoCents;
      prodObj.precoReferencia = custoCents;
      prodObj.estoqueMinimo = estMin;
      prodObj.estoqueMaximo = estMax;
      prodObj.localizacao = loc;
      prodObj.fornecedoresIds = selectedSuppliers;
      prodObj.fornecedorId = selectedSuppliers[0] || '';

      if (selectedSuppliers.length > 0) {
        const sups = selectedSuppliers.map(sId => (DB.suppliers || []).find(x => x.id === sId)).filter(Boolean);
        prodObj.fornecedorNome = sups.map(s => s.nome).join(', ');
      } else {
        prodObj.fornecedorNome = 'Não informado';
      }
    }

    commit();
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    render();
    toast(`Item ${codigo} [v${prodObj.versao}] salvo com sucesso no banco central!`, 'success');
  },

  salvarEntradaAvulsaMUC(){
    const prodId = document.getElementById('entMucProd').value;
    const qtdMilli = qtyToMilli(parseFloat(document.getElementById('entMucQtd').value || 0));
    const custoCents = Math.round(parseFloat(document.getElementById('entMucCusto').value || 0) * 100);
    const obs = document.getElementById('entMucObs').value.trim();

    if(qtdMilli <= 0 || custoCents < 0){ toast('Informe quantidade e custo válidos!', 'error'); return; }

    const p = DB.products.find(x => x.id === prodId);
    if(!p) return;

    const depCentral = DB.warehouses.find(w => w.ativo && w.tipo === 'materia_prima') || DB.warehouses[0];
    const saldoAtualMilli = DB.stockBalances.filter(b => b.productId === prodId && b.warehouseId === depCentral.id).reduce((a,b)=>a+b.quantidade,0);
    const custoAtualCents = p.custoMedioCents || p.precoReferencia || 0;

    const novoCustoMedio = Math.round(((saldoAtualMilli * custoAtualCents) + (qtdMilli * custoCents)) / (saldoAtualMilli + qtdMilli));
    p.custoMedioCents = novoCustoMedio;
    p.precoReferencia = novoCustoMedio;

    const movId = uid('mov');
    DB.stockMovements.push({
      id: movId,
      productId: prodId,
      warehouseId: depCentral.id,
      tipo: 'entrada_avulsa_muc',
      quantidade: qtdMilli,
      sinal: 1,
      custoUnitario: custoCents,
      origemTipo: 'entrada_avulsa',
      origemId: movId,
      observacao: obs,
      criadoEm: new Date().toISOString()
    });

    let bal = DB.stockBalances.find(b => b.productId === prodId && b.warehouseId === depCentral.id);
    if(!bal){
      bal = { id: uid('bal'), productId: prodId, warehouseId: depCentral.id, quantidade: 0, custoMedio: novoCustoMedio };
      DB.stockBalances.push(bal);
    }
    bal.quantidade += qtdMilli;
    bal.custoMedio = novoCustoMedio;

    // Re-avalia automáticos PCP de OPs aguardando material
    (DB.productionOrders || []).filter(o => o.status === 'aguardando_material').forEach(op => {
      App.avaliarNecessidadeMateriaisOP(op.id);
    });

    commit();
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    render();
    toast(`Entrada avulsa de ${formatMilliQty(qtdMilli, p.unidade)} registrada com sucesso!`, 'success');
  },

  salvarRequisicaoConsumoMUC(){

    const saldoDispMilli = DB.stockBalances.filter(b => b.productId === prodId && b.warehouseId === depCentral.id).reduce((a,b)=>a+b.quantidade,0);

    DB.stockMovements.push({
      id: movId,

  confirmarExcluirRegistro(entityType, id, nomeRegistro){
    let bloqueio = null;
    const currentU = getCurrentUser();

    if (entityType === 'product') {
      const emBOM = (DB.bomItems || []).some(b => b.componentProductId === id || b.productId === id);
      const emSaldo = (DB.stockBalances || []).some(b => b.productId === id && b.quantidade > 0);
      const emOP = (DB.productionOrders || []).some(o => o.productId === id && o.status !== 'concluida');
      if (emBOM) bloqueio = 'O produto está cadastrado em Fichas Técnicas (BOM) ativas.';
      else if (emSaldo) bloqueio = 'O produto possui saldo físico positivo em estoque.';
      else if (emOP) bloqueio = 'O produto possui Ordens de Produção em andamento.';
    } else if (entityType === 'supplier') {
      const emPC = (DB.orders || []).some(o => o.supplierId === id && o.status !== 'concluido');
      if (emPC) bloqueio = 'O fornecedor possui Pedidos de Compra ativos.';
    } else if (entityType === 'customer') {
      const emPV = (DB.salesOrders || []).some(s => s.customerId === id && s.status !== 'cancelado');
      if (emPV) bloqueio = 'O cliente possui Pedidos de Venda em carteira.';
    } else if (entityType === 'salesOrder') {
      const emOP = (DB.productionOrders || []).some(o => o.salesOrderId === id && o.status !== 'concluida');
      if (emOP) bloqueio = 'O Pedido de Venda possui Ordens de Produção em andamento.';
    }

    if (bloqueio) {
      dialog({
        title: 'Exclusão Bloqueada por Dependências',
        width: 'max-w-md',
        body: `<div class="p-4 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-xs text-red-700 dark:text-red-300 space-y-2">
          <p class="font-bold flex items-center gap-1.5">${icon('alert', 'w-4 h-4')} Não é possível excluir "${esc(nomeRegistro)}"</p>
          <p>${esc(bloqueio)}</p>
        </div>`,
        footer: `${btn('Entendido', { variant: 'primary', action: 'this.closest(".fixed").remove()' })}`
      });
      return;
    }

    const isProd = entityType === 'product';
    const prodTarget = isProd ? (DB.products || []).find(x => x.id === id) : null;
    const isMPorMUC = prodTarget && (prodTarget.tipo_item === 'materia_prima' || prodTarget.tipo_item === 'uso_consumo' || prodTarget.tipo === 'MP' || prodTarget.tipo === 'MUC');

    const dialogMsg = isMPorMUC
      ? `Tem certeza que deseja inativar o item "<b>${esc(nomeRegistro)}</b>"?<br><br><span class="text-xs text-amber-600 dark:text-amber-400 font-semibold">ℹ️ REGRA DE AUDITORIA (Soft Delete): O item será inativado e removido das listagens ativas, mas seu registro será preservado no banco para manter intacto o histórico contábil, rastreabilidade de compras e custos anteriores.</span>`
      : `Tem certeza que deseja excluir "${nomeRegistro}"?\nEsta ação removerá o registro do catálogo ativo.`;

    confirmDialog(
      isMPorMUC ? 'Inativar Item (Soft Delete)' : 'Confirmar Exclusão de Registro',
      dialogMsg,
      () => {
        if (entityType === 'product') {
          const p = (DB.products || []).find(x => x.id === id);
          if (p) {
            // REGRA 1 — SOFT DELETE PERMANENTE EM MP E MUC (E PA)
            p.ativo = false;
            p.excluido = true;
            p.excluidoEm = new Date().toISOString();
            p.excluidoPor = currentU ? currentU.name : 'Super Admin';
            p.versao = (p.versao || 1) + 1;
            p.atualizadoEm = new Date().toISOString();

            if (!DB.auditLogs) DB.auditLogs = [];
            DB.auditLogs.unshift({
              id: uid(),
              timestamp: new Date().toISOString(),
              action: 'PRODUCT_SOFT_DELETED',
              actor: { id: currentU?.id || 'sistema', name: currentU?.name || 'Super Admin' },
              target: { id: p.id, codigo: p.codigo, descricao: p.descricao, tipo_item: p.tipo_item || p.tipo },
              details: `Soft delete aplicado ao item ${p.codigo} (${p.descricao}). Registro preservado no banco de dados para rastreabilidade de custos e movimentações.`
            });

            commit();
            render();
            toast(`Item "${p.descricao}" inativado com sucesso (Soft Delete aplicado; histórico preservado no banco)!`, 'success');
            return;
          }
        }
        else if (entityType === 'supplier') DB.suppliers = DB.suppliers.filter(x => x.id !== id);
        else if (entityType === 'customer') DB.customers = DB.customers.filter(x => x.id !== id);
        else if (entityType === 'user') DB.users = DB.users.filter(x => x.id !== id);
        else if (entityType === 'salesOrder') DB.salesOrders = DB.salesOrders.filter(x => x.id !== id);
        else if (entityType === 'productionOrder') DB.productionOrders = DB.productionOrders.filter(x => x.id !== id);
        else if (entityType === 'order') DB.orders = DB.orders.filter(x => x.id !== id);
        else if (entityType === 'quotation') DB.quotations = DB.quotations.filter(x => x.id !== id);
        else if (entityType === 'requisition') DB.requisitions = DB.requisitions.filter(x => x.id !== id);
        else if (entityType === 'bom') DB.bomVersions = DB.bomVersions.filter(x => x.id !== id);
        else if (entityType === 'warehouse') DB.warehouses = DB.warehouses.filter(x => x.id !== id);
        else if (entityType === 'workCenter') DB.workCenters = DB.workCenters.filter(x => x.id !== id);
        else if (entityType === 'ticket') DB.tickets = DB.tickets.filter(x => x.id !== id);

        commit();
        render();
        toast(`Registro "${nomeRegistro}" excluído com sucesso!`, 'success');
      },
      { danger: true, label: isMPorMUC ? 'Inativar Item' : 'Confirmar Exclusão' }
    );
  },

  exportBackup(){
    DB.lastBackup = new Date().toISOString();
    save();
    const payload = JSON.stringify(DB, null, 2);
    syncBackendDump(payload);

    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gescomp-backup-${today()}.json`;
    a.click();
    toast('Backup baixado com sucesso!', 'success');

  triggerOffsiteDump(){
    DB.lastBackup = new Date().toISOString();
    save();
    if (window.location.hostname.includes('netlify.app') || window.location.hostname.includes('vercel.app') || window.location.hostname.includes('github.io')) {
      toast('Dump do banco de dados concluído e salvo no navegador / Supabase!', 'success');
      render();
      return;
    }
    toast('Iniciando dump do banco para pasta offsite...', 'info');
    fetch('/api/backup/dump', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DB, null, 2)
    }).then(res => {
      if(!res.ok) throw new Error('Servidor offsite indisponível');
      return res.json();
    }).then(data => {
      if(data && data.success){
        toast('Dump Offsite concluído e replicado com sucesso!', 'success');
        render();
      } else {
        toast('Aviso ao gerar dump offsite.', 'warning');
      }
    }).catch(() => {
      toast('Dump gerado localmente no navegador.', 'info');
    });
  },
  importBackup(){
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json';
    inp.onchange = e => {
      const file = e.target.files[0];
      if(!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try{
          const imported = JSON.parse(ev.target.result);
          if(imported.users && imported.products){
            DB = imported;
            commit();
            toast('Dados restaurados com sucesso!', 'success');
          }
        }catch(err){ toast('Arquivo inválido!', 'error'); }
      };
      r.readAsText(file);
    };
    inp.click();
  },

  sincronizarListaMateriaisBOM(bomId){
    const bom = DB.bomVersions.find(b => b.id === bomId);
    if (!bom) return;
    const bomItems = DB.bomItems.filter(x => x.bomVersionId === bomId);
    bom.listaMateriais = bomItems.map(x => {
      const prod = DB.products.find(p => p.id === x.componentProductId);
      return {
        codigoItem: prod ? prod.codigo : '',
        componentProductId: x.componentProductId,
        quantidade: x.quantidade,
        tipo: prod ? (prod.tipo || 'MP') : 'MP',
        perdaPercentual: x.perdaPercentual,
        observacao: x.observacao || ''
      };
    });
  },

  atualizarQtdItemBOM(bomId, itemId, value){
    const item = DB.bomItems.find(i => i.id === itemId);
    if(!item) return;

    const qtdMilli = qtyToMilli(parseFloat(value) || 0);
    if(qtdMilli <= 0){
      toast('Informe uma quantidade necessária maior que zero.', 'error');
      return;
    }

    item.quantidade = qtdMilli;
    App.sincronizarListaMateriaisBOM(bomId);
    commit();
    toast('Quantidade necessária da BOM atualizada!', 'success');
  },

  salvarItemBOM(bomId){
    const compId = document.getElementById('addBomComp')?.value;
    const qtdMilli = qtyToMilli(parseFloat(document.getElementById('addBomQtd')?.value) || 1);
    const perdaCent = Math.round((parseFloat(document.getElementById('addBomPerda')?.value) || 0) * 100);
    const obs = document.getElementById('addBomObs')?.value.trim() || '';

    if (!compId) { toast('Selecione um material ou componente do estoque.', 'error'); return; }
    if (qtdMilli <= 0) { toast('Informe uma quantidade necessária maior que zero.', 'error'); return; }

    const existente = DB.bomItems.find(i => i.bomVersionId === bomId && i.componentProductId === compId);
    if (existente) {
      existente.quantidade += qtdMilli;
      if (obs) existente.observacao = obs;
    } else {
      DB.bomItems.push({
        id: uid('bomit'),
        bomVersionId: bomId,
        componentProductId: compId,
        quantidade: qtdMilli,
        perdaPercentual: perdaCent,
        opcional: false,
        observacao: obs
      });
    }

    App.sincronizarListaMateriaisBOM(bomId);
    commit();
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    toast('Material/Componente vinculado à Ficha Técnica com sucesso!', 'success');
    App.modalArvoreBOM(bomId);
    render();
  },

  removerItemBOM(bomId, itemId){
    DB.bomItems = DB.bomItems.filter(i => i.id !== itemId);
    App.sincronizarListaMateriaisBOM(bomId);
    commit();
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    toast('Componente removido da Ficha Técnica.', 'info');
    App.modalArvoreBOM(bomId);
    render();
  },

  // Modais de Alerta e Reposição (Parte 6)
  gerarRequisicoesReposicaoLote(){
    const abertos = (DB.stockAlerts||[]).filter(a => ['aberto','reconhecido'].includes(a.status));
    if(!abertos.length){ toast('Nenhum alerta pendente de reposição.', 'info'); return; }
    for(const a of abertos){
      const prod = DB.products.find(p => p.id === a.productId);
      const falta = Math.max(0, (prod ? prod.estoqueMinimo : 0) - a.disponivelNoDisparo);
      const lote = prod?.consumoMedioDiario ? prod.consumoMedioDiario * 15 : (prod?.estoqueMinimo || 10000);
      const qtdPedir = Math.max(falta, lote);

      const reqId = uid('req');
      const reqNum = seq(DB.requisitions, 'seqReqPrefix', 'REQ-');
      DB.requisitions.push({
        id: reqId,
        numero: reqNum,
        solicitanteId: (DB.currentUser && DB.currentUser.id) || 'usr-compras',
        solicitanteNome: 'Alerta Estoque Mínimo',
        setor: 'Suprimentos',
        prioridade: a.nivel === 'zerado' ? 'urgente' : 'alta',
        status: 'aprovada',
        observacoes: `Reposição automática do alerta de estoque mínimo (${a.nivel.toUpperCase()})`,
        criadoEm: today()
      });
      DB.requisitionItems.push({
        id: uid('reqit'),
        requisitionId: reqId,
        productId: a.productId,
        descricao: prod ? prod.descricao : 'Item de Reposição',
        unidade: prod ? prod.unidade : 'UN',
        quantidade: qtdPedir,
        precoEstimado: prod ? prod.precoReferencia : 0
      });
      a.status = 'em_reposicao';
      a.atualizadoEm = new Date().toISOString();
    }
    commit();
    toast(`${abertos.length} Requisição(ões) de Reposição gerada(s)!`, 'success');
  },
  gerarRequisicaoReposicao(alertId){
    const a = DB.stockAlerts.find(x => x.id === alertId);
    if(!a) return;
    const prod = DB.products.find(p => p.id === a.productId);
    const reqId = uid('req');
    const reqNum = seq(DB.requisitions, 'seqReqPrefix', 'REQ-');
    DB.requisitions.push({
      id: reqId,
      numero: reqNum,
      solicitanteId: (DB.currentUser && DB.currentUser.id) || 'usr-compras',
      solicitanteNome: 'Alerta Estoque',
      setor: 'Suprimentos',
      prioridade: a.nivel === 'zerado' ? 'urgente' : 'alta',
      status: 'aprovada',
      observacoes: `Reposição do alerta ${alertId}`,
      criadoEm: today()
    });
    DB.requisitionItems.push({
      id: uid('reqit'),
      requisitionId: reqId,
      productId: a.productId,
      descricao: prod ? prod.descricao : 'Item',
      unidade: prod ? prod.unidade : 'UN',

  rfqOnProdutoSelect(itemId, prodId){
    if (prodId === 'NOVO_CADASTRO') {
      App.modalNovoProduto(null);
      return;
    }
    const item = UI.rfqState.items.find(i => i.id === itemId);
    if (!item) return;
    item.productId = prodId;
    const prod = (DB.products || []).find(p => p.id === prodId);
    if (prod) {
      item.descricao = prod.descricao;
      item.unidade = prod.unidade || 'UN';
    }
    const container = document.getElementById('rfqItemsContainer');
    if (container) container.innerHTML = App.renderRfqItemsHTML();
  },

  rfqUpdateItemField(itemId, field, val){
    const item = UI.rfqState?.items.find(i => i.id === itemId);
    if (item) item[field] = val;
  },

  rfqAdicionarFornecedor(supplierId){
    if (!supplierId) return;
    if (!UI.rfqState) UI.rfqState = { items: [], suppliers: [] };

    if (UI.rfqState.suppliers.some(s => s.supplierId === supplierId)) {
      toast('Fornecedor já adicionado a esta cotação.', 'info');
      return;
    }

    const supObj = (DB.suppliers || []).find(s => s.id === supplierId);
    if (!supObj) return;

    UI.rfqState.suppliers.push({
      supplierId: supObj.id,
      nome: supObj.nome,
      email: supObj.email,
      cnpj: supObj.cnpj,
      telefone: supObj.telefone,
      contatoCotacao: supObj.contatoNome || '',
      formaEnvio: 'email'
    });

    const container = document.getElementById('rfqSuppliersContainer');
    if (container) container.innerHTML = App.renderRfqSuppliersHTML();
  },

    if (!UI.rfqState) return;
    UI.rfqState.suppliers = UI.rfqState.suppliers.filter(s => s.supplierId !== supplierId);
    const container = document.getElementById('rfqSuppliersContainer');
    if (container) container.innerHTML = App.renderRfqSuppliersHTML();
  },

    if (s) s[field] = val;
  },

  salvarNovaCotacao(){
    // Limpa mensagens de erro anteriores
    document.querySelectorAll('[id^="err_"]').forEach(el => {
      el.classList.add('hidden');
      el.innerText = '';
    });

    const objeto = (document.getElementById('cotObjeto')?.value || '').trim();
    const prioridade = document.getElementById('cotPrioridade')?.value;
    const comprador = (document.getElementById('cotComprador')?.value || '').trim();
    const aprovadorNome = (document.getElementById('cotAprovador')?.value || '').trim();
    const aprovadorId = `usr-aprovador-${Date.now()}`;
    const prazoResposta = document.getElementById('cotPrazoResposta')?.value;
    const prazoEntrega = (document.getElementById('cotPrazoEntrega')?.value || '').trim();
    const validadeProposta = parseInt(document.getElementById('cotValidadeProposta')?.value || 30, 10);
    const obsGerais = (document.getElementById('cotObsGerais')?.value || '').trim();

    let localEntrega = document.getElementById('cotLocalEntregaSelect')?.value || 'Matriz JP3D';
    if (localEntrega === 'outro') {
      localEntrega = (document.getElementById('cotLocalEntregaOther')?.value || '').trim() || 'Outro';
    }

    const payCheckboxes = document.querySelectorAll('input[name="rfqPayOption"]:checked');
    const formasPagamento = Array.from(payCheckboxes).map(cb => cb.value);
    const payOther = (document.getElementById('cotPayOptionOther')?.value || '').trim();
    if (payOther) formasPagamento.push(payOther);

    let hasErrors = false;

    // Validação 1: Objeto
    if (!objeto || objeto.length < 5) {
      const err = document.getElementById('err_cotObjeto');
      if (err) {
        err.innerText = 'Objeto da cotação é obrigatório e deve ter no mínimo 5 caracteres.';
        err.classList.remove('hidden');
      }
      hasErrors = true;
    }

    // Validação 2: Comprador
    if (!comprador) {
      const err = document.getElementById('err_cotComprador');
      if (err) {
        err.innerText = 'Comprador responsável é obrigatório.';
        err.classList.remove('hidden');
      }
      hasErrors = true;
    }

    // Validação 3: Aprovador
    if (!aprovadorId) {
      const err = document.getElementById('err_cotAprovador');
      if (err) {
        err.innerText = 'Selecione um aprovador responsável.';
        err.classList.remove('hidden');
      }
      hasErrors = true;
    }

    // Validação 4: Prazo de Resposta
    const todayStr = new Date().toISOString().split('T')[0];
    if (!prazoResposta || prazoResposta < todayStr) {
      const err = document.getElementById('err_cotPrazoResposta');
      if (err) {
        err.innerText = 'Prazo de resposta é obrigatório e deve ser uma data futura.';
        err.classList.remove('hidden');
      }
      hasErrors = true;
    }

    // Validação 5: Produtos (mínimo 1 produto com descrição e quantidade > 0)
    const items = UI.rfqState?.items || [];
    const validItems = items.filter(i => i.descricao.trim() && i.quantidade > 0);
    if (validItems.length === 0) {
      const err = document.getElementById('err_rfqItems');
      if (err) {
        err.innerText = 'Adicione ao menos 1 produto válido com descrição e quantidade maior que 0.';
        err.classList.remove('hidden');
      }
      hasErrors = true;
    }

    // Validação 6: Fornecedores (ao menos 1 fornecedor)
    const suppliers = UI.rfqState?.suppliers || [];
    if (suppliers.length === 0) {
      const err = document.getElementById('err_rfqSuppliers');
      if (err) {
        err.innerText = 'Vincule ao menos 1 fornecedor para realizar a cotação.';
        err.classList.remove('hidden');
      }
      hasErrors = true;
    }

    // Validação 7: Formas de Pagamento
    if (formasPagamento.length === 0) {
      const err = document.getElementById('err_rfqPayOptions');
      if (err) {
        err.innerText = 'Selecione ao menos 1 forma de pagamento aceita.';
        err.classList.remove('hidden');
      }
      hasErrors = true;
    }

    if (hasErrors) {
      toast('Por favor, corrija os erros destacados no formulário.', 'error');
      return;
    }

    const editId = document.getElementById('cotEditId')?.value;
    const isEditing = Boolean(editId && (DB.quotations || []).some(q => q.id === editId));

    if (isEditing) {
      const cotIndex = DB.quotations.findIndex(q => q.id === editId);
      if (cotIndex !== -1) {
        DB.quotations[cotIndex].titulo = objeto;
        DB.quotations[cotIndex].prioridade = prioridade;
        DB.quotations[cotIndex].comprador = comprador;
        DB.quotations[cotIndex].solicitante = comprador;
        DB.quotations[cotIndex].aprovador = aprovadorNome;
        DB.quotations[cotIndex].prazo_resposta = prazoResposta;
        DB.quotations[cotIndex].prazo = prazoResposta;
        DB.quotations[cotIndex].prazo_entrega = prazoEntrega;
        DB.quotations[cotIndex].validade_proposta = validadeProposta;
        DB.quotations[cotIndex].formas_pagamento = formasPagamento;
        DB.quotations[cotIndex].local_entrega = localEntrega;
        DB.quotations[cotIndex].observacoes = obsGerais;

        // Atualiza itens
        DB.quotationItems = (DB.quotationItems || []).filter(i => i.quotationId !== editId);
        validItems.forEach(it => {
          let targetProdId = it.productId || null;

          if (!targetProdId && it.autoRegister && it.descricao.trim()) {
            const autoCode = 'MP-AUTO-' + String(Math.floor(1000 + Math.random() * 9000));
            const newProd = {
              id: uid('p'),
              codigo: autoCode,
              descricao: it.descricao.trim(),
              unidade: it.unidade || 'UN',
              categoria: 'Outros',
              tipo: 'MP',
              custoMedioCents: 0,
              precoReferencia: 0,
              estoqueMinimo: 0,
              ativo: true
            };
            if (!DB.products) DB.products = [];
            DB.products.push(newProd);
            targetProdId = newProd.id;
            toast(`Produto "${it.descricao.trim()}" cadastrado automaticamente no catálogo!`, 'info');
          }

          DB.quotationItems.push({
            id: it.id || uid('qit'),
            quotationId: editId,
            productId: targetProdId,
            descricao: it.descricao.trim(),
            unidade: it.unidade || 'UN',
            quantidade: qtyToMilli(it.quantidade),
            especificacao: it.especificacao.trim(),
            valorEstimadoUnit: 0,
            convertido: 0
          });
        });

        // Atualiza fornecedores
        DB.quotationSuppliers = (DB.quotationSuppliers || []).filter(s => s.quotationId !== editId);
        suppliers.forEach(sup => {
          DB.quotationSuppliers.push({
            id: uid('qs'),
            quotationId: editId,
            supplierId: sup.supplierId,
            contatoCotacao: (sup.contatoCotacao || '').trim(),
            formaEnvio: sup.formaEnvio || 'email',
            criadoEm: today()
          });
        });

        log('quotation', editId, `Cotação ${DB.quotations[cotIndex].numero} ("${objeto}") atualizada por ${comprador}.`);
        commit();
        toast(`Cotação ${DB.quotations[cotIndex].numero} atualizada com sucesso!`, 'success');
        document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
        render();
        return;
      }
    }

    // 1. Cria o registro principal da cotação no DB local
    const num = seq(DB.quotations, 'seqCotPrefix', 'COT-');
    const cotId = uid('cot');
    const newCot = {
      id: cotId,
      numero: num,
      origem: 'padrao',
      comparacao_base: 'a_vista',
      titulo: objeto,
      solicitante: comprador,
      comprador,
      aprovador: aprovadorNome,
      aprovadorId,
      prazo_resposta: prazoResposta,
      prazo: prazoResposta,
      prazo_entrega: prazoEntrega,
      validade_proposta: validadeProposta,
      formas_pagamento: formasPagamento,
      local_entrega: localEntrega,
      observacoes: obsGerais,
      status: 'nova_solicitacao',
      prioridade,
      valorEstimado: 0,
      valorFinal: 0,
      criadoEm: today()
    };

    if (!DB.quotations) DB.quotations = [];
    DB.quotations.push(newCot);

    // 2. Grava itens no DB local
    if (!DB.quotationItems) DB.quotationItems = [];
    const insertedItems = validItems.map(it => {
      let targetProdId = it.productId || null;

      if (!targetProdId && it.autoRegister && it.descricao.trim()) {
        const autoCode = 'MP-AUTO-' + String(Math.floor(1000 + Math.random() * 9000));
        const newProd = {
          id: uid('p'),
          codigo: autoCode,
          descricao: it.descricao.trim(),
          unidade: it.unidade || 'UN',
          categoria: 'Outros',
          tipo: 'MP',
          custoMedioCents: 0,
          precoReferencia: 0,
          estoqueMinimo: 0,
          ativo: true
        };
        if (!DB.products) DB.products = [];
        DB.products.push(newProd);
        targetProdId = newProd.id;
        toast(`Produto "${it.descricao.trim()}" cadastrado automaticamente no catálogo!`, 'info');
      }

      const qit = {
        id: uid('qit'),
        quotationId: cotId,
        productId: targetProdId,
        descricao: it.descricao.trim(),
        unidade: it.unidade || 'UN',
        quantidade: qtyToMilli(it.quantidade),
        especificacao: it.especificacao.trim(),
        valorEstimadoUnit: 0,
        convertido: 0
      };
      DB.quotationItems.push(qit);
      return qit;
    });

    // 3. Grava fornecedores no DB local
    if (!DB.quotationSuppliers) DB.quotationSuppliers = [];
    const insertedSuppliers = suppliers.map(sup => {
      const qs = {
        id: uid('qs'),
        quotationId: cotId,
        supplierId: sup.supplierId,
        contatoCotacao: sup.contatoCotacao.trim(),
        formaEnvio: sup.formaEnvio || 'email',
        criadoEm: today()
      };
      DB.quotationSuppliers.push(qs);
      return qs;
    });

    log('quotation', cotId, `Cotação ${num} ("${objeto}") criada por ${comprador}. Aprovador: ${aprovadorNome}.`);
    commit();

    // 4. Tenta sincronizar com endpoints backend Express (POST /api/quotations, POST /api/quotations/:id/items, POST /api/quotations/:id/suppliers)
    const token = sessionStorage.getItem('jp3d_token');
    const authHeaders = token ? { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } : { 'Content-Type': 'application/json' };

    fetch('/api/quotations', {
      method: 'POST',
      headers: authHeaders,
      body: JSON.stringify({
        titulo: objeto,
        prioridade,
        comprador,
        aprovador: aprovadorNome,
        aprovadorId,
        prazo_resposta: prazoResposta,
        prazo_entrega: prazoEntrega,
        validade_proposta: validadeProposta,
        formas_pagamento: formasPagamento,
        local_entrega: localEntrega,
        observacoes: obsGerais,
        status: 'nova_solicitacao'
      })
    }).then(res => res.json()).then(data => {
      if (data.success && data.quotation?.id) {
        const remoteId = data.quotation.id;
        fetch(`/api/quotations/${remoteId}/items`, {
          method: 'POST',
          headers: authHeaders,
          body: JSON.stringify({
            itens: validItems.map(i => ({
              produto_id: i.productId || null,
              descricao: i.descricao,
              unidade: i.unidade,
              quantidade: qtyToMilli(i.quantidade),
              especificacao: i.especificacao
            }))
          })
        }).catch(() => {});

        fetch(`/api/quotations/${remoteId}/suppliers`, {
          method: 'POST',
          headers: authHeaders,
          body: JSON.stringify({
            fornecedores: suppliers.map(s => ({
              supplier_id: s.supplierId,
              contato_cotacao: s.contatoCotacao,
              forma_envio: s.formaEnvio
            }))
          })
        }).catch(() => {});
      }
    }).catch(() => {});

    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    render();
    toast(`Cotação ${num} criada com sucesso!`, 'success');
  },

  processarAprovacaoCotacao(cotId, novoStatus, obs = ''){
    const cot = (DB.quotations || []).find(c => c.id === cotId);
    if (!cot) return;

    const user = getCurrentUser();
    const statusAntigo = cot.status;

    if (novoStatus === 'aprovada' || novoStatus === 'reprovada') {
      const isComprador = (cot.comprador || '').toLowerCase() === (user?.name || '').toLowerCase();
      const isSuper = user?.roleId === 'super_admin' || user?.roleId === 'role-admin';
      if (isComprador && !isSuper) {
        toast('Atenção: O comprador responsável não pode aprovar ou reprovar a sua própria cotação.', 'error');
        return;
      }
    }

    cot.status = novoStatus;
    if (novoStatus === 'reprovada') cot.motivoReprovacao = obs;

    if (!DB.quotationHistory) DB.quotationHistory = [];
    DB.quotationHistory.push({
      id: uid('qh'),
      quotationId: cotId,
      statusDe: statusAntigo,
      statusPara: novoStatus,
      observacao: obs,
      usuarioId: user?.id || 'usr-sys',
      usuarioNome: user?.name || 'Sistema',
      criadoEm: today()
    });

    log('quotation', cotId, `Status da cotação ${cot.numero} alterado de ${statusAntigo} para ${novoStatus} por ${user?.name}.`);
    commit();

    const token = sessionStorage.getItem('jp3d_token');
    fetch(`/api/quotations/${cotId}/status`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', ...(token ? { 'Authorization': `Bearer ${token}` } : {}) },
      body: JSON.stringify({ status: novoStatus, observacao: obs, motivo_reprovacao: obs })
    }).catch(() => {});

    render();
    toast(`Status da cotação ${cot.numero} atualizado para "${novoStatus}"!`, 'success');
  },

  /* Módulo Gescomp — Integração Supabase & Local Fallback */
  getSupabaseClient(){
    if(window._supabaseClient) return window._supabaseClient;
    const url = window.VITE_SUPABASE_URL || (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_URL) || localStorage.getItem('VITE_SUPABASE_URL') || DB.supabaseUrl || '';
    const key = window.VITE_SUPABASE_ANON_KEY || (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_ANON_KEY) || localStorage.getItem('VITE_SUPABASE_ANON_KEY') || DB.supabaseKey || '';
    if(typeof supabase !== 'undefined' && url && key){
      try {
        window._supabaseClient = supabase.createClient(url, key);
        return window._supabaseClient;
      } catch(e) { console.warn('[Supabase] Init error:', e); }
    }
    return null;
  },

  salvarNota(){
    const u = getCurrentUser();
    if (!u) { toast('Faça login primeiro.', 'error'); return; }
    const id = document.getElementById('noteId')?.value;
    const titulo = document.getElementById('noteTitulo')?.value.trim();
    const categoria = document.getElementById('noteCategoria')?.value || 'Geral';
    const conteudo = document.getElementById('noteConteudo')?.value.trim();

    if (!titulo || !conteudo) {
      toast('Preencha o título e o conteúdo da nota.', 'error');
      return;
    }

    if (!DB.gescompNotes) DB.gescompNotes = [];

    let targetId = id;
    if (id) {
      const idx = DB.gescompNotes.findIndex(x => x.id === id);
      if (idx !== -1) {
        DB.gescompNotes[idx].titulo = titulo;
        DB.gescompNotes[idx].categoria = categoria;
        DB.gescompNotes[idx].conteudo = conteudo;
        DB.gescompNotes[idx].atualizadoEm = new Date().toISOString();
        toast('Nota atualizada com sucesso!', 'success');
      }
    } else {
      targetId = uid('note');
      DB.gescompNotes.unshift({
        id: targetId,
        userId: u.id,
        titulo,
        categoria,
        conteudo,
        criadoEm: new Date().toISOString()
      });
      toast('Nota criada com sucesso!', 'success');
    }

    commit();
    document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());
    render();

    // Sincroniza com a tabela 'compras' do Supabase para que as notas apareçam no celular do mesmo usuário
    const sb = App.getSupabaseClient();
    if(sb){
      const payloadTexto = titulo + '|||' + conteudo;
      const payloadCat = 'Nota:' + categoria;
      if (id) {
        sb.from('compras').update({
          texto: payloadTexto,
          categoria: payloadCat
        }).eq('id', id).then(({ error }) => { if(error) console.warn('[Supabase Note Update Error]', error); });
      } else {
        sb.from('compras').insert([{
          id: targetId,
          texto: payloadTexto,
          quantidade: 1,
          unidade: 'nota',
          concluido: false,
          categoria: payloadCat,
          usuario_id: u.id
        }]).then(({ error }) => { if(error) console.warn('[Supabase Note Insert Error]', error); });
      }
    }

  deleteGescompNote(noteId){
    confirmDialog(
      'Excluir Nota',
      'Tem certeza que deseja excluir esta anotação permanentemente?',
      () => {
        if (!DB.gescompNotes) DB.gescompNotes = [];
        DB.gescompNotes = DB.gescompNotes.filter(n => n.id !== noteId);
        commit();
        render();
        const sb = App.getSupabaseClient();
        if(sb){
          sb.from('compras').delete().eq('id', noteId)
            .then(({ error }) => { if(error) console.warn('[Supabase Note Delete Error]', error); });
        }
        toast('Nota removida!', 'info');
      },
      { danger: true, label: 'Excluir' }
    );
  },

  async fetchGescompFromSupabase(){
    const u = getCurrentUser();
    if(!u) return;
    const sb = App.getSupabaseClient();
    if(!sb) return;

    try {
      // 1. Sincroniza todas as Tarefas da Empresa
      const { data: tasksData, error: errT } = await sb.from('tasks').select('*');
      if(!errT && Array.isArray(tasksData)){
        const existingMap = new Map((DB.gescompTasks||[]).map(t => [t.id, t]));
        tasksData.forEach(t => {
          const usrObj = (DB.users || []).find(x => x.id === t.usuario_id);
          existingMap.set(t.id, {
            id: t.id,
            userId: t.usuario_id,
            authorName: usrObj ? usrObj.name : 'Equipe',
            text: t.texto,
            completed: !!t.concluido,
            createdAt: t.criado_em
          });
        });
        DB.gescompTasks = Array.from(existingMap.values());
      }

      // 2. Sincroniza todas as Compras e Notas da Empresa (tabela 'compras')
      const { data: comprasData, error: errC } = await sb.from('compras').select('*');
      if(!errC && Array.isArray(comprasData)){
        const shopMap = new Map((DB.gescompShoppingList||[]).map(s => [s.id, s]));
        const noteMap = new Map((DB.gescompNotes||[]).map(n => [n.id, n]));

        comprasData.forEach(c => {
          const usrObj = (DB.users || []).find(x => x.id === c.usuario_id);
          const authorName = usrObj ? usrObj.name : 'Equipe';

          if(c.unidade === 'nota' || (c.categoria && c.categoria.startsWith('Nota'))){
            const parts = (c.texto || '').split('|||');
            const titulo = parts[0] || c.texto;
            const conteudo = parts[1] || parts[0] || '';
            const cat = (c.categoria || '').replace(/^Nota:/, '') || 'Geral';
            noteMap.set(c.id, {
              id: c.id,
              userId: c.usuario_id,
              authorName,
              titulo,
              categoria: cat,
              conteudo,
              criadoEm: c.criado_em
            });
          } else {
            shopMap.set(c.id, {
              id: c.id,
              userId: c.usuario_id,
              authorName,
              text: c.texto,
              quantity: c.quantidade || 1,
              unit: c.unidade || 'UN',
              completed: !!c.concluido,
              createdAt: c.criado_em
            });
          }
        });

        DB.gescompShoppingList = Array.from(shopMap.values());
        DB.gescompNotes = Array.from(noteMap.values());
      }

      commit();
      render();
    } catch(e) {
      console.warn('[Gescomp Fetch Error]', e);
    }
  },

  gescompClearAll(tab='tasks'){
    confirmDialog(
      'Limpar Itens desta Aba',
      `Deseja limpar permanentemente todas as suas ${tab==='notes' ? 'anotações' : (tab==='shopping' ? 'compras rápidas' : 'tarefas')}?`,
      () => {
        const u = getCurrentUser();
        if(!u) return;
        if (tab === 'notes') {
          DB.gescompNotes = [];
        } else if (tab === 'shopping') {
          DB.gescompShoppingList = [];
        } else {
          DB.gescompTasks = [];
        }
        commit();
        toast('Dados limpos com sucesso!', 'info');
      },
      { danger: true, label: 'Limpar Aba' }
    );
  }
};

/* ============================ ROTEAMENTO & RENDER ============================ */
let ROUTE = { path: '/', params: {} };

function parseHash(){
  const h = window.location.hash.slice(1) || '/';
  const [path, queryString] = h.split('?');
  const params = {};
  if(queryString){
    queryString.split('&').forEach(pair => {
      const [k, v] = pair.split('=');
      params[k] = decodeURIComponent(v || '');
    });
  }
  return { path, params };
}

function checkAutoBackup(){
  try {
    if (typeof DB === 'undefined') return;
    const twoDaysMs = 2 * 24 * 60 * 60 * 1000;
    const lastBackupTime = DB.lastBackup ? new Date(DB.lastBackup).getTime() : 0;
    const now = Date.now();
    if (now - lastBackupTime >= twoDaysMs) {
      console.log('[AutoBackup] Executando rotina automática de backup a cada 2 dias...');
      DB.lastBackup = new Date().toISOString();
      save();
      syncBackendDump(DB);
    }
  } catch(e) {}
}

function render(){
  checkAutoBackup();
  ROUTE = parseHash();
  const u = getCurrentUser();
  if(!u){
    // Salva a rota para redirecionar após autenticação bem-sucedida
    try {
      if (typeof window !== 'undefined' && window.location.hash && window.location.hash !== '#/' && window.location.hash !== '#/login') {
        sessionStorage.setItem('jp3d_intended_hash', window.location.hash);
      }
    } catch(_) {}

    updateLoginLogosUI();
    const rootEl = document.getElementById('root');
    if (rootEl) rootEl.innerHTML = '';
    const loginEl = document.getElementById('loginScreen');
    if (loginEl) loginEl.classList.remove('hidden');
    App.loadSavedUser();
    return;
  }
  const loginEl = document.getElementById('loginScreen');
  if (loginEl) loginEl.classList.add('hidden');

  const routeTitles = {
    '/': 'Dashboard Executiva',
    '/crm': 'CRM & Prospecção',
    '/vendas': 'Vendas & Pedidos',
    '/producao': 'Produção (Kanban)',
    '/chao-de-fabrica': 'Chão de Fábrica',
    '/estoque': 'Estoque',
    '/suporte': 'Suporte Técnico',
    '/cotacoes': 'Cotações & RFQ',
    '/pedidos': 'Pedidos de Compra',
    '/clientes': 'Clientes',
    '/fornecedores': 'Fornecedores',
    '/produtos': 'Produtos',
    '/fichas-tecnicas': 'Fichas Técnicas',
    '/centros-trabalho': 'Centros de Trabalho',
    '/depositos': 'Depósitos',
    '/config': 'Configurações',
    '/gescomp': 'Gescomp Mobile Portal',
    '/fluxo': 'Pipeline Macro'
  };
  const pageBase = routeTitles[ROUTE.path] || 'ERP Industrial';
  document.title = `${pageBase} — ${getCompanyName('fantasia')}`;

  let content;
  if(ROUTE.path==='/' || ROUTE.path==='') content = viewDashboard();
  else if(ROUTE.path==='/gescomp' || ROUTE.path==='/tarefas') content = viewGescomp();
  else if(ROUTE.path==='/crm') content = viewCRM();
  else if(ROUTE.path==='/fluxo') content = viewPipelineFluxo();
  else if(ROUTE.path==='/vendas') content = viewVendas();
  else if(ROUTE.path==='/producao') content = viewProducao();
  else if(ROUTE.path==='/chao-de-fabrica') content = viewChaoDeFabrica();
  else if(ROUTE.path==='/estoque') content = viewEstoque();
  else if(ROUTE.path==='/suporte') content = viewSuporte();
  else if(ROUTE.path==='/cotacoes') content = viewCotacoes();
  else if(ROUTE.path==='/pedidos') content = viewOrders();
  else if(ROUTE.path==='/fichas-tecnicas' || ROUTE.path==='/fichas') content = viewFichasTecnicas();
  else if(ROUTE.path==='/centros-trabalho') content = viewCentrosTrabalho();
  else if(ROUTE.path==='/depositos') content = viewDepositos();
  else if(ROUTE.path==='/clientes') content = viewClientes();
  else if(ROUTE.path==='/fornecedores') content = viewSuppliers();
  else if(ROUTE.path==='/produtos') content = viewProducts();
  else if(ROUTE.path==='/config') content = viewConfig();
  else content = notFound();

  document.getElementById('root').innerHTML = shell(content);
}

window.App = App;
window.addEventListener('hashchange', render);
window.addEventListener('load', () => {
  try {
    sessionStorage.removeItem('jp3d_user_id');
    sessionStorage.removeItem('jp3d_token');
    localStorage.removeItem('jp3d_session_userId');
  } catch(_) {}
  if (typeof DB !== 'undefined' && DB) {
    DB.currentUser = null;
  }
  avaliarEstoqueMinimoEmLote();
  render();

  setTimeout(() => {
    if (typeof App !== 'undefined') {
      if (typeof App.syncAllFromCloud === 'function') App.syncAllFromCloud();
      if (typeof App.initRealtimeSync === 'function') App.initRealtimeSync();
    }
  }, 250);
});

// Sincronização automática quando a aba/janela recebe foco (ex: alternar do celular para o desktop)
if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('focus', () => {
    if (typeof App !== 'undefined' && typeof App.syncAllFromCloud === 'function') {
      App.syncAllFromCloud();
    }
  });
}
if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && typeof App !== 'undefined' && typeof App.syncAllFromCloud === 'function') {
      App.syncAllFromCloud();
    }
  });
}
</script>
